<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ポイント制テスト</title>
<!-- ポイント制のテストページ（11-04）。本番 index.html とは別に手で作っている。数字は points/config.json -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3b1c00; --red: #e8213f; --gold: #ffd400; }
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; text-align: center; min-height: 100vh; }
  main { max-width: 1200px; margin: 0 auto; padding: 8px 16px 110px; box-sizing: border-box; }
  .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; font-weight: 400; }
  .rd { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; }
  .topnav { display: flex; flex-direction: column; align-items: flex-end; padding: 10px 12px 0; }
  .topnav a { padding: 6px 14px; border-radius: 999px; border: 1px solid #666; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; font-weight: bold; text-decoration: none; }
  .topnav .stop { margin-top: 4px; font-size: 11px; color: #ff9a9a; }
  h1 { font-size: clamp(16px, 4.9vw, 40px); line-height: 1.3; margin: 12px 0 10px; font-weight: 900;
       background: linear-gradient(180deg, #fff6c8 0%, #f5d36b 30%, #c8961e 55%, #f1cf6a 72%, #8a5a0b 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 2px 0 #3a2500) drop-shadow(0 0 10px rgba(255, 200, 80, .25)); }
  h1 .line { display: block; white-space: nowrap; }
  h1 .line.note { font-size: .55em; margin-top: 8px; }
  .testnote { display: inline-block; margin: 0 0 4px; padding: 4px 12px; border-radius: 999px; background: #ff3d7f; color: #fff; font-size: 12px; font-weight: bold; }

  /* ===== 持ち点の枠 ===== */
  .pbox { max-width: 760px; margin: 18px auto 0; padding: 18px 14px 20px; border-radius: 20px; border: 3px solid var(--ink);
          background: linear-gradient(#2c2545, #1d1830); box-shadow: 0 5px 0 var(--ink), 0 0 30px rgba(120, 90, 255, .15); }
  .pbox.danger { background: linear-gradient(#4a1420, #250a10); box-shadow: 0 5px 0 var(--ink), 0 0 34px rgba(255, 40, 60, .35); }
  .pbox.reward { background: linear-gradient(#4a3a08, #2a2004); box-shadow: 0 5px 0 var(--ink), 0 0 34px rgba(255, 210, 60, .4); }
  .plabel { font-size: 14px; color: #c9c4dd; }
  .pnum { font-family: 'Mochiy Pop One', sans-serif; font-size: clamp(46px, 14vw, 76px); line-height: 1.1; color: #fff;
          -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); font-variant-numeric: tabular-nums; }
  .pnum small { font-size: .38em; margin-left: 4px; }
  .pghost { margin-top: 2px; font-size: 13px; color: #c9c4dd; min-height: 1.4em; }
  .pghost b { color: #ff7a8a; font-size: 1.15em; }
  .pghost b.up { color: var(--gold); }

  /* メーター: 左端 0（最強罰ゲーム）→ スタート → 右端 ご褒美 */
  .pmeter { position: relative; margin: 78px 18px 50px; }
  .pcap { font-size: 11px; color: #a9a3c2; margin: 0 0 14px; }
  .ptrack { position: relative; height: 30px; border-radius: 999px; background: #120f1f; border: 3px solid var(--ink);
            box-shadow: inset 0 3px 6px rgba(0,0,0,.7), 0 3px 0 var(--ink); overflow: hidden; }
  .pfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; transition: width 1.1s cubic-bezier(.3,1.3,.5,1), background .6s;
           background: repeating-linear-gradient(-45deg, rgba(255,255,255,.25) 0 8px, rgba(255,255,255,0) 8px 16px), linear-gradient(90deg, #ff3d5a, #ffb03b 45%, #7be36b 80%);
           background-size: 22.6px 22.6px, var(--full, 100%) 100%; animation: stripes .8s linear infinite; box-shadow: inset 0 4px 0 rgba(255,255,255,.3); }
  @keyframes stripes { to { background-position: 22.6px 0, 0 0; } }
  /* このままだと減る分（集計中の企画） */
  .pghostbar { position: absolute; top: 0; bottom: 0; transition: left 1.1s, width 1.1s;
               background: repeating-linear-gradient(-45deg, rgba(255,90,110,.55) 0 5px, rgba(255,90,110,.15) 5px 10px); }
  .pghostbar.up { background: repeating-linear-gradient(-45deg, rgba(255,212,0,.55) 0 5px, rgba(255,212,0,.15) 5px 10px); }
  /* 5,000点ごとのルーレットの印 */
  .wheel { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); box-sizing: border-box; flex: none;
           background: conic-gradient(#ff3d5a 0 60deg, #ffd400 0 120deg, #3dc3ff 0 180deg, #ff3d5a 0 240deg, #ffd400 0 300deg, #3dc3ff 0); position: relative; }
  .wheel::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; border: 1px solid var(--ink); }
  .ptick { position: absolute; top: -34px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  .ptick .wheel { width: 20px; height: 20px; filter: grayscale(1) brightness(.6); opacity: .7; }
  .ptick::after { content: ""; width: 2px; height: 14px; background: rgba(255,255,255,.35); margin-top: 1px; }
  .ptick.got .wheel { filter: none; opacity: 1; animation: wobble 2.4s ease-in-out infinite; }
  .ptick.got::after { background: #ff7a8a; }
  @keyframes wobble { 50% { transform: rotate(180deg); } }
  .pend { position: absolute; top: 40px; font-size: 12px; line-height: 1.35; white-space: nowrap; }
  .pend b { display: block; font-size: 15px; }
  .pend.zero { left: -14px; text-align: left; color: #ff7a8a; }
  .pend.goal { right: -14px; text-align: right; color: var(--gold); }
  .pstart { position: absolute; top: -6px; height: 42px; width: 0; border-left: 3px dashed #fff; }
  .pstart span { padding: 1px 8px; border-radius: 999px; background: #fff; color: var(--ink) !important; }
  .pstart span { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #ddd; white-space: nowrap; }
  .pnow { position: absolute; top: -74px; transform: translateX(-50%); transition: left 1.1s cubic-bezier(.3,1.3,.5,1); z-index: 3; pointer-events: none; }
  .pnow span { display: block; padding: 3px 10px 4px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: #ff2f78; font-size: 13px; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
  .pnow::after { content: ""; display: block; margin: -1px auto 0; width: 0; border-style: solid; border-width: 10px 7px 0 7px; border-color: var(--ink) transparent transparent transparent; }

  /* アウト・ストック・最強罰ゲームの3枚 */
  .pcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
  .pc { padding: 12px 8px 12px; border-radius: 16px; border: 3px solid var(--ink); background: #3a3354; box-shadow: 0 3px 0 var(--ink); color: #e9e6f5; }
  .pc .t { font-size: 13px; color: #c9c4dd; }
  .pc .s { font-size: 11px; color: #a9a3c2; margin-top: 6px; line-height: 1.5; }
  .pc .s b { color: #fff; }
  .outs { display: flex; justify-content: center; gap: 8px; margin: 10px 0 2px; }
  .out { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--ink); background: #241f36; box-sizing: border-box; position: relative; }
  .out.on { background: radial-gradient(circle at 35% 30%, #ff9a9a, #ff2b2b 60%, #b30000); box-shadow: 0 0 12px rgba(255, 60, 60, .8); }
  .out.on.now { animation: outpop .8s cubic-bezier(.2,2,.4,1); }
  @keyframes outpop { 0% { transform: scale(.3); } 60% { transform: scale(1.4); } 100% { transform: none; } }
  .outs-count { font-size: 22px; color: #fff; }
  .pc.two { border-color: #ff2b2b; animation: alarm 1.6s ease-in-out infinite; }
  @keyframes alarm { 50% { box-shadow: 0 3px 0 var(--ink), 0 0 22px rgba(255, 40, 40, .8); } }
  .stocks { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin: 10px 0 2px; min-height: 30px; align-items: center; }
  .stocks .wheel { width: 28px; height: 28px; animation: wobble 3s ease-in-out infinite; }
  .stocks .none { font-size: 13px; color: #8d88a3; }
  .stock-count { font-size: 22px; color: #fff; }
  .pc.ult { background: linear-gradient(#2a0a10, #12040a); color: #ffb3bd; }
  .pc.ult .nm { margin: 10px 0 2px; font-size: clamp(15px, 4.2vw, 22px); color: #fff; line-height: 1.25;
                -webkit-text-stroke: 4px #5a0010; paint-order: stroke fill; text-shadow: 0 0 14px rgba(255, 40, 60, .7); }
  .pc.ult .nm small { display: block; font-size: .55em; -webkit-text-stroke: 0; text-shadow: none; color: #ffb3bd; margin-bottom: 2px; }
  .settle { margin-top: 14px; font-size: 13px; color: #c9c4dd; }
  .settle b { font-family: 'Mochiy Pop One', sans-serif; font-weight: 400; color: #fff; font-size: 18px; font-variant-numeric: tabular-nums; }
  .pbanner { display: none; margin: 14px auto 0; padding: 10px 16px; border-radius: 14px; border: 3px solid var(--ink); font-size: clamp(16px, 4.6vw, 22px); box-shadow: 0 4px 0 var(--ink); }
  .pbox.danger .pbanner { display: inline-block; background: var(--red); color: #fff; animation: nudge 2.4s ease-in-out infinite; }
  .pbox.reward .pbanner { display: inline-block; background: var(--gold); color: var(--ink); }
  @keyframes nudge { 0%, 88%, 100% { transform: none; } 91% { transform: translateX(-4px) rotate(-1deg); } 94% { transform: translateX(4px) rotate(1deg); } }

  /* ルール */
  .rules { max-width: 760px; margin: 22px auto 0; padding: 14px 16px; border: 2px solid #444; border-radius: 14px; background: rgba(0,0,0,.55); text-align: left; }
  .rules h2 { margin: 0 0 8px; font-size: 15px; text-align: center; color: #ffeb99; }
  .rules ol { margin: 0; padding-left: 1.4em; font-size: 14px; line-height: 1.8; color: #ddd; }
  .rules b { color: #fff; }

  /* 企画の枠（見本） */
  .sec { margin: 30px 0 0; font-size: 15px; color: #ffeb99; }
  .sec small { display: block; color: #aaa; font-size: 12px; margin-top: 2px; }
  .camps { display: grid; gap: 18px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); max-width: 760px; margin-left: auto; margin-right: auto; }
  .camp { min-width: 0; background: rgba(255,255,255,.03); border: 2px solid #333; border-radius: 16px; padding: 14px 12px 16px; display: flex; flex-direction: column; align-items: center; }
  .ctarget { font-size: 18px; line-height: 1.2; font-weight: 600; color: #ffeb99; font-family: 'Shippori Mincho', 'Yu Mincho', serif; }
  .ctarget b { font-size: 2.1em; font-weight: 800; margin: 0 .08em; }
  .chow { font-size: 12px; color: #aaa; margin-top: 4px; }
  .player { position: relative; width: 100%; max-width: 200px; aspect-ratio: 9 / 16; margin: 10px auto 0; }
  a.thumb { display: block; overflow: hidden; border-radius: 12px; background: #000; }
  a.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  a.thumb .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 64px; height: 44px; border-radius: 12px; background: #f00; display: flex; align-items: center; justify-content: center; }
  a.thumb .play::before { content: ""; border-style: solid; border-width: 10px 0 10px 17px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
  .ctitle { font-size: 13px; color: #aaa; margin: 8px 0 0; line-height: 1.5; height: 3em; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .sub { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0 0; padding: 8px 16px; border-radius: 999px; background: #f00; color: #fff; font-weight: bold; text-decoration: none; font-size: 13px; }
  .sub::before { content: ""; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #fff; }
  .cbox { align-self: stretch; margin: 14px 0 0; padding: 14px 10px; border: 2px solid #444; border-radius: 12px; background: rgba(0,0,0,.55); }
  .label { font-size: 13px; color: #aaa; }
  .cviews { font-size: 44px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .cviews .goal { font-size: .42em; color: #aaa; }
  .cbar { height: 12px; border-radius: 999px; background: #2b2540; border: 2px solid var(--ink); overflow: hidden; margin: 6px 6px 0; }
  .cbar div { height: 100%; width: 0; background: linear-gradient(90deg, #ff6fae, #ffb03b); transition: width 1s; }
  .cpt { margin-top: 12px; padding: 8px 10px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); background: #fff; color: var(--ink); font-size: 14px; }
  .cpt b { font-family: 'Mochiy Pop One', sans-serif; font-weight: 400; font-size: 1.6em; color: var(--red); }
  .cpt.up b { color: #2e9b3f; }
  .cd { margin-top: 10px; font-size: 13px; color: #aaa; }
  .cd b { display: block; font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; }

  /* ポイントの記録 */
  .box { max-width: 560px; margin: 24px auto 0; padding: 16px; border: 2px solid #444; border-radius: 12px; background: rgba(0,0,0,.55); }
  #hist { list-style: none; padding: 0; margin: 10px 0 0; text-align: left; }
  #hist li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #333; font-size: 13px; line-height: 1.5; }
  #hist .hb { flex: 1; min-width: 0; }
  #hist .hn { color: #ccc; }
  #hist .hd { font-family: 'Mochiy Pop One', sans-serif; font-size: 18px; white-space: nowrap; }
  #hist .hd.m { color: #ff7a8a; } #hist .hd.p { color: var(--gold); }
  #hist .tag { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: bold; }
  #hist .tag.k { background: var(--red); color: #fff; } #hist .tag.s { background: #3dc3ff; color: var(--ink); }
  #hist .empty { justify-content: center; color: #888; }

  /* 見本の切り替え（テストページだけ） */
  #demo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 8px; background: rgba(0,0,0,.8); border-top: 1px solid #444; }
  #demo span { font-size: 12px; color: #aaa; align-self: center; }
  #demo button { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #666; background: #222; color: #fff; cursor: pointer; }
  #demo button.on { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: bold; }

  @media (max-width: 560px) {
    .pcards { grid-template-columns: 1fr 1fr; }
    .pc.ult { grid-column: 1 / -1; }
    .pmeter { margin-left: 10px; margin-right: 10px; }
    .pend.zero { left: -6px; } .pend.goal { right: -6px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<nav class="topnav"><a href="https://tenk-tk.github.io/portfolio/" rel="noopener">切り抜き依頼はこちら</a><span class="stop">※現在受注停止中</span></nav>
<main>
  <h1 id="headline"></h1>
  <div class="testnote">テスト用のページです（ポイント制の見本）</div>

  <section class="pbox" id="pbox">
    <div class="plabel pop">編集者の持ち点</div>
    <div class="pnum" id="pnum">0<small>点</small></div>
    <div class="pghost rd" id="pghost"></div>
    <div class="pmeter" id="pmeter">
      <div class="ptrack" id="ptrack"><div class="pghostbar" id="pghostbar"></div><div class="pfill" id="pfill"></div></div>
      <div class="pnow pop" id="pnow"><span>いまここ</span></div>
      <div class="pend zero rd"><b>0点</b><span id="ultShort"></span></div>
      <div class="pend goal rd"><b id="rewardNum"></b><span id="rewardName"></span></div>
    </div>
    <div class="pcap rd" id="pcap"></div>
    <div class="pcards">
      <div class="pc" id="outCard">
        <div class="t pop">アウト</div>
        <div class="outs" id="outs"></div>
        <div class="outs-count pop" id="outsCount"></div>
        <div class="s rd" id="outNote"></div>
      </div>
      <div class="pc">
        <div class="t pop">罰ゲーム抽選ストック</div>
        <div class="stocks" id="stocks"></div>
        <div class="stock-count pop" id="stockCount"></div>
        <div class="s rd" id="stockNote"></div>
      </div>
      <div class="pc ult">
        <div class="t pop">持ち点0で</div>
        <div class="nm pop" id="ultName"></div>
        <div class="s rd">最強罰ゲーム確定</div>
      </div>
    </div>
    <div class="settle rd">月末の抽選まで <b id="settleCd">--</b></div>
    <div class="pbanner pop" id="pbanner"></div>
  </section>

  <section class="rules">
    <h2 class="pop">ルール</h2>
    <ol id="rules"></ol>
  </section>

  <div class="sec pop">集計中の企画<small>※見本です（かいねこさん・クリシアさんの動画に新しい目標を当てて表示。今の持ち点には入れていません）</small></div>
  <div class="camps" id="camps"></div>

  <div class="box">
    <div class="label">ポイントの記録</div>
    <ul id="hist"></ul>
  </div>
</main>
<div id="demo"><span>見本:</span></div>
<script>
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const sfmt = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + fmt(Math.abs(n));
const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
let cfg, live = [];

function targetOf(c) { return c.target || Math.max(cfg.targetMin, Math.round(c.subs * cfg.targetPerSub)); }

// 終わった企画を順に足し引きする。目標に届かない本が outsFor 回続いたら outPenalty を引いてアウトを0に戻す。目標を超えたらアウトは0に戻す
// ストックは「スタートからいちばん下がった所」までに 5,000点の線をいくつ下回ったか（戻っても消えない）。月末に抽選した分は settledStocks で引く
function compute(hist) {
  let pts = cfg.startPoints, outs = 0, low = pts;
  const rows = hist.map(h => {
    const d = h.views - h.target, r = { ...h, d, k: 0, s: 0 };
    const before = Math.floor((cfg.startPoints - low) / cfg.stockEvery);
    pts += d;
    if (d < 0) { outs++; if (outs >= cfg.outsFor) { pts -= cfg.outPenalty; r.k = cfg.outPenalty; outs = 0; } } else outs = 0;
    low = Math.min(low, pts);
    r.s = Math.floor((cfg.startPoints - low) / cfg.stockEvery) - before;
    r.after = pts;
    return r;
  });
  const total = Math.floor((cfg.startPoints - Math.max(0, low)) / cfg.stockEvery);
  return { pts, outs, low, stocks: Math.max(0, total - (cfg.settledStocks || 0)), crossed: total, rows };
}

function buildMeter() {
  const max = cfg.rewardLine, m = document.getElementById('pmeter');
  for (let p = cfg.startPoints - cfg.stockEvery; p > 0; p -= cfg.stockEvery) {
    const t = document.createElement('div'); t.className = 'ptick'; t.dataset.p = p;
    t.style.left = (p / max * 100) + '%'; t.innerHTML = '<div class="wheel"></div>';
    m.appendChild(t);
  }
  const s = document.createElement('div'); s.className = 'pstart rd'; s.style.left = (cfg.startPoints / max * 100) + '%';
  document.getElementById('pcap').innerHTML = `点線＝スタート ${fmt(cfg.startPoints)}点 ／ <span class="wheel" style="display:inline-block;width:14px;height:14px;vertical-align:-2px"></span> ＝ ${fmt(cfg.stockEvery)}点ごとのルーレット`;
  m.querySelector('.ptrack').after(s);
  document.getElementById('rewardNum').textContent = fmt(cfg.rewardLine) + '点';
  document.getElementById('rewardName').textContent = cfg.rewardName;
  document.getElementById('ultShort').textContent = cfg.ultimate.short;
  document.getElementById('ultName').innerHTML = `<small>富士急ハイランド</small>${cfg.ultimate.short}`;
  const o = document.getElementById('outs');
  for (let i = 0; i < cfg.outsFor; i++) { const d = document.createElement('div'); d.className = 'out'; o.appendChild(d); }
  document.getElementById('rules').innerHTML = [
    `目標再生数は <b>依頼者さんのチャンネル登録者数 × ${cfg.targetPerSub}</b>（最低 ${fmt(cfg.targetMin)} 回）`,
    `締め切りの再生数と目標の差が、そのまま持ち点に入ります（目標 6,000 で 3,000 回なら <b>−3,000点</b>）`,
    `持ち点が <b>${fmt(cfg.stockEvery)}点</b> 減るごとに、罰ゲーム抽選ルーレットを1つストック。<b>月末にまとめて抽選</b>します`,
    `目標に届かない動画が <b>${cfg.outsFor}本続くと ${cfg.outsFor}アウトで −${fmt(cfg.outPenalty)}点</b>（目標を超えるとアウトは0に戻ります）`,
    `持ち点が <b>0点</b> になったら <b>最強罰ゲーム「${cfg.ultimate.short}」</b>（富士急ハイランド）`,
    `持ち点が <b>${fmt(cfg.rewardLine)}点</b> を超えたらご褒美（内容は準備中）`,
  ].map(x => `<li>${x}</li>`).join('');
}

let shownPts = null;
function countTo(el, to) {
  const from = shownPts == null ? to : shownPts; shownPts = to;
  const t0 = performance.now(), dur = 900;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.innerHTML = fmt(from + (to - from) * e) + '<small>点</small>'; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

let prevOuts = 0;
function paint(hist) {
  const r = compute(hist), max = cfg.rewardLine, pct = p => Math.max(0, Math.min(100, p / max * 100));
  const pts = Math.max(0, r.pts);
  countTo(document.getElementById('pnum'), pts);
  const fill = document.getElementById('pfill');
  fill.style.width = pct(pts) + '%';
  fill.style.setProperty('--full', (100 / Math.max(.01, pct(pts) / 100)) + '%');   // 色の流れはメーター全体に対して固定
  document.getElementById('pnow').style.left = pct(pts) + '%';
  // 集計中の企画の「このままだと」
  const g = live.reduce((a, c) => a + (c.v - c.t), 0), gb = document.getElementById('pghostbar'), gh = document.getElementById('pghost');
  const after = Math.max(0, Math.min(max, pts + g));
  gb.classList.toggle('up', g > 0);
  gb.style.left = pct(Math.min(pts, after)) + '%'; gb.style.width = Math.abs(pct(after) - pct(pts)) + '%';
  gh.innerHTML = live.length && g ? `集計中の企画がこのまま終わると <b class="${g > 0 ? 'up' : ''}">${sfmt(g)}点</b>` : '';
  // ルーレットの印（下回った線に色が付く）
  document.querySelectorAll('.ptick').forEach(t => t.classList.toggle('got', +t.dataset.p >= cfg.startPoints - r.crossed * cfg.stockEvery));
  // アウト
  const os = document.querySelectorAll('.out');
  os.forEach((d, i) => { d.classList.toggle('on', i < r.outs); d.classList.toggle('now', i < r.outs && i >= prevOuts); });
  prevOuts = r.outs;
  document.getElementById('outsCount').textContent = r.outs + 'アウト';
  document.getElementById('outCard').classList.toggle('two', r.outs === cfg.outsFor - 1);
  document.getElementById('outNote').innerHTML = r.outs === cfg.outsFor - 1 ? `次も届かなければ <b>−${fmt(cfg.outPenalty)}点</b>` : `${cfg.outsFor}アウトで <b>−${fmt(cfg.outPenalty)}点</b>`;
  // ストック
  const st = document.getElementById('stocks'); st.innerHTML = '';
  if (r.stocks) for (let i = 0; i < r.stocks; i++) { const w = document.createElement('div'); w.className = 'wheel'; w.style.animationDelay = (i * .3) + 's'; st.appendChild(w); }
  else st.innerHTML = '<span class="none rd">まだありません</span>';
  document.getElementById('stockCount').textContent = r.stocks + '個';
  const nextLine = cfg.startPoints - (r.crossed + 1) * cfg.stockEvery;
  document.getElementById('stockNote').innerHTML = nextLine > 0 ? `次のストックまで あと <b>${fmt(pts - nextLine)}点</b>` : '次は最強罰ゲーム';
  // 0点・ご褒美
  const box = document.getElementById('pbox'), bn = document.getElementById('pbanner');
  box.classList.toggle('danger', pts <= 0); box.classList.toggle('reward', pts >= cfg.rewardLine);
  bn.textContent = pts <= 0 ? `最強罰ゲーム「${cfg.ultimate.short}」確定` : pts >= cfg.rewardLine ? 'ご褒美ライン到達！' : '';
  // 記録
  const ul = document.getElementById('hist'); ul.innerHTML = '';
  if (!r.rows.length) ul.innerHTML = `<li class="empty">まだありません（ここから ${fmt(cfg.startPoints)}点で始まります）</li>`;
  r.rows.slice().reverse().forEach(x => {
    const li = document.createElement('li');
    li.innerHTML = `<div class="hb"><div class="ht"></div><div class="hn">${fmt(x.views)} / ${fmt(x.target)} 回</div>` +
      (x.k ? `<span class="tag k">${cfg.outsFor}アウト −${fmt(x.k)}</span> ` : '') + (x.s ? `<span class="tag s">ストック +${x.s}</span>` : '') +
      `</div><div class="hd ${x.d < 0 ? 'm' : 'p'}">${sfmt(x.d - x.k)}</div>`;
    li.querySelector('.ht').textContent = x.title;
    ul.appendChild(li);
  });
}

function setThumb(a, img, id) {
  a.href = 'https://www.youtube.com/shorts/' + id; if (!touch) a.target = '_blank';
  const urls = ['oardefault', 'hqdefault'].map(n => 'https://i.ytimg.com/vi/' + id + '/' + n + '.jpg'); let i = 0;
  const next = () => { if (i < urls.length) img.src = urls[i++]; };
  img.onerror = next; img.onload = () => { if (img.naturalWidth <= 120) next(); }; next();
}

function card(c) {
  const el = document.createElement('section'), t = targetOf(c); el.className = 'camp';
  el.innerHTML = `
    <div class="ctarget">目標<b>${fmt(t)}</b>回再生</div>
    <div class="chow rd">登録者 ${fmt(c.subs)}人 × ${cfg.targetPerSub}${c.subs * cfg.targetPerSub < cfg.targetMin ? `（最低 ${fmt(cfg.targetMin)}回）` : ''}</div>
    <a class="player thumb" rel="noopener"><img alt=""><span class="play"></span></a>
    <p class="ctitle"></p>
    <a class="sub" rel="noopener"></a>
    <div class="cbox">
      <div class="label">現在の再生数</div>
      <div class="cviews"><span class="v">0</span><span class="goal"> / ${fmt(t)}</span></div>
      <div class="cbar"><div></div></div>
      <div class="cpt rd"></div>
      <div class="cd">締め切りまで<b>--:--:--</b></div>
    </div>`;
  setThumb(el.querySelector('.thumb'), el.querySelector('img'), c.videoId);
  el.querySelector('.ctitle').textContent = c.videoTitle;
  const s = el.querySelector('.sub'); s.href = c.channel.url + '?sub_confirmation=1'; if (!touch) s.target = '_blank';
  s.textContent = c.channel.name + 'さんのチャンネルを登録';
  c.el = el; c.t = t; c.v = 0;
  return el;
}

function paintCard(c) {
  const d = c.v - c.t, el = c.el;
  el.querySelector('.v').textContent = fmt(c.v);
  el.querySelector('.cbar div').style.width = Math.min(100, c.v / c.t * 100) + '%';
  const p = el.querySelector('.cpt'); p.classList.toggle('up', d >= 0);
  p.innerHTML = d >= 0 ? `このままだと <b>${sfmt(d)}</b> 点` : `このままだと <b>${sfmt(d)}</b> 点<br>あと ${fmt(-d)} 回で 0点`;
}

function cd(ms) { if (ms <= 0) return '集計終了'; const s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
  return (d ? d + '日 ' : '') + [s % 86400 / 3600, s % 3600 / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':'); }
function monthEnd() { const j = new Date(Date.now() + 9 * 3600e3); return Date.UTC(j.getUTCFullYear(), j.getUTCMonth() + 1, 0, 14, 59, 0); }   // 月末 23:59（日本時間）
function tick() {
  live.forEach(c => c.el.querySelector('.cd b').textContent = cd(new Date(c.deadline) - Date.now()));
  document.getElementById('settleCd').textContent = cd(monthEnd() - Date.now());
}

// 見本の持ち点（テストページだけ）。実際の記録は config の history
const S = (title, target, views) => ({ title, target, views });
const DEMOS = {
  '今': null,
  '1本目が届かず': [S('見本の企画A', 4110, 2462)],
  '2アウト': [S('見本の企画A', 4110, 2462), S('見本の企画B', 2247, 1235)],
  '3アウト': [S('見本の企画A', 4110, 2462), S('見本の企画B', 2247, 1235), S('見本の企画C', 4320, 1800)],
  '目標超え': [S('見本の企画A', 4110, 2462), S('見本の企画B', 2247, 1235), S('見本の企画C', 3000, 9800)],
  'ピンチ': [S('見本の企画A', 6000, 1000), S('見本の企画B', 5000, 900), S('見本の企画C', 4000, 800), S('見本の企画D', 6000, 2100), S('見本の企画E', 5000, 1500), S('見本の企画F', 4000, 1200)],
  '0点': [S('見本の企画A', 6000, 1000), S('見本の企画B', 5000, 900), S('見本の企画C', 4000, 800), S('見本の企画D', 6000, 2100), S('見本の企画E', 5000, 1500), S('見本の企画F', 4000, 1200), S('見本の企画G', 5000, 2000), S('見本の企画H', 6000, 500)],
  'ご褒美': [S('見本の企画A', 3000, 9000), S('見本の企画B', 4000, 8500)],
};

(async () => {
  cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
  const h = document.getElementById('headline');
  cfg.headline.split('|').forEach(line => { const s = document.createElement('span'); s.className = line.startsWith('※') ? 'line note' : 'line'; s.textContent = line; h.appendChild(s); });
  buildMeter();
  const camps = document.getElementById('camps');
  live = cfg.campaigns;
  live.forEach(c => camps.appendChild(card(c)));
  let cur = '今';
  const bar = document.getElementById('demo');
  Object.keys(DEMOS).forEach(k => { const b = document.createElement('button'); b.textContent = k; b.onclick = () => { cur = k; [...bar.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b)); paint(DEMOS[k] || cfg.history); }; bar.appendChild(b); });
  bar.querySelector('button').classList.add('on');
  const q = new URLSearchParams(location.search).get('demo'); if (q && DEMOS[q]) [...bar.querySelectorAll('button')].find(b => b.textContent === q).click();
  tick(); setInterval(tick, 1000);
  const poll = async () => {
    for (const c of live) { try { c.v = (await (await fetch(c.viewsFrom + '?t=' + Date.now(), { cache: 'no-store' })).json()).views; } catch (_) {} paintCard(c); }
    paint(DEMOS[cur] || cfg.history);
  };
  await poll(); setInterval(poll, 60000);
})();
</script>
