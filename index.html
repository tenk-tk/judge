<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伸びなきゃ罰ゲーム</title>
<!--meta-->
<meta property="og:type" content="website">
<meta property="og:url" content="https://tenk-tk.github.io/judgement/">
<meta property="og:title" content="この動画が6000回再生を超えなければ編集者が虫を食べます">
<meta property="og:description" content="※集計は11/3 23:59まで｜焼き鳥の話をしていたら…麻雀でまさかの展開に！？【麻雀/VPL】">
<meta property="og:image" content="https://i.ytimg.com/vi/an5ngHMrbEQ/maxresdefault.jpg">
<meta name="twitter:card" content="summary_large_image">
<!--/meta-->
<style>
  body { margin: 0; font-family: sans-serif; background: #111; color: #fff; text-align: center; min-height: 100vh; }
  #bg { position: fixed; inset: 0; z-index: -1; background: #111 center / cover no-repeat; transition: background-image 1s; }
  #bg::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .35); }
  .box { background: rgba(0, 0, 0, .55); backdrop-filter: blur(4px); }
  .share { display: inline-block; margin: 0 0 24px; padding: 12px 28px; border-radius: 999px; background: #000;
           color: #fff; border: 1px solid #666; font-weight: bold; text-decoration: none; }
  #records { list-style: none; padding: 0; margin: 12px 0 0; text-align: left; }
  #records li { padding: 12px 0; border-top: 1px solid #333; font-size: 14px; line-height: 1.6; display: flex; gap: 12px; align-items: flex-start; }
  #records .rthumb { position: relative; flex: 0 0 96px; aspect-ratio: 9 / 16; border-radius: 8px; overflow: hidden; background: #000; }
  #records .rthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #records .rthumb::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-40%, -50%);
                            border-style: solid; border-width: 9px 0 9px 15px; border-color: transparent transparent transparent #fff;
                            filter: drop-shadow(0 0 3px rgba(0,0,0,.8)); }
  #records .rbody { flex: 1; min-width: 0; }
  #records .rnum { margin-top: 4px; color: #ccc; } #records .rnum b { font-size: 22px; color: #fff; }
  #records a { color: #9cf; }
  .win { color: #ffd400; font-weight: bold; } .lose { color: #ff5a5a; font-weight: bold; }
  body.shake main { animation: shake .6s ease-in-out 2; }
  @keyframes shake { 0%,100% { transform: translate(0) } 20% { transform: translate(-8px, 4px) }
    40% { transform: translate(7px, -5px) } 60% { transform: translate(-5px, 3px) } 80% { transform: translate(4px, -2px) } }
  #stagebar { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  #stagebar button { font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid #666; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: clamp(22px, 6.8vw, 40px); line-height: 1.3; margin: 12px 0 10px; font-weight: 900;
       background: linear-gradient(180deg, #fff6c8 0%, #f5d36b 30%, #c8961e 55%, #f1cf6a 72%, #8a5a0b 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 2px 0 #3a2500) drop-shadow(0 0 10px rgba(255, 200, 80, .25)); }
  h1 .line { display: block; white-space: nowrap; }
  .goal { font-size: .45em; color: #aaa; }
  .rule { font-size: 14px; color: #bbb; margin-top: 14px; }
  .box { margin: 24px 0; padding: 16px; border: 2px solid #444; border-radius: 12px; }
  .label { font-size: 13px; color: #aaa; }
  #views { font-size: 64px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #views.bump { color: #ffd400; }
  #left { font-size: 18px; margin-top: 4px; }
  #countdown { font-size: 36px; font-weight: bold; font-variant-numeric: tabular-nums; }
  #result { font-size: 28px; font-weight: bold; margin-top: 8px; }
  .player { position: relative; width: 100%; max-width: 315px; aspect-ratio: 9 / 16; margin: 0 auto; }
  .player > div, .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* 埋め込みの代わりのサムネ。押すと YouTube（スマホはアプリ）へ移る */
  a.thumb { display: block; overflow: hidden; border-radius: 12px; background: #000; cursor: pointer; }
  a.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  a.thumb .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72px; height: 50px;
                  border-radius: 14px; background: #f00; display: flex; align-items: center; justify-content: center; }
  a.thumb .play::before { content: ""; border-style: solid; border-width: 11px 0 11px 19px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
  a.thumb .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 8px; font-size: 13px; font-weight: bold;
                 color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.8)); }
  .bar { height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 10px; position: relative; }
  .bar .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.55); }
  #next { font-size: 13px; color: #ccc; margin-top: 8px; }
  .sub { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 0; padding: 10px 22px; border-radius: 999px;
         background: #f00; color: #fff; font-weight: bold; text-decoration: none; font-size: 15px; }
  .sub::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent #fff; }
  #milestone { position: fixed; left: 50%; top: 18%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 50; pointer-events: none;
               padding: 18px 28px; border-radius: 16px; background: rgba(0,0,0,.85); border: 3px solid #ffd400; white-space: nowrap;
               font-size: clamp(22px, 7vw, 40px); font-weight: 900; color: #ffd400; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .35s; }
  #milestone.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #milestone small { display: block; font-size: .45em; color: #fff; margin-top: 4px; }
  .bar > div { height: 100%; width: 0; background: #ffd400; transition: width .8s; }
  .updated { font-size: 12px; color: #888; margin-top: 8px; }
  .plus { position: absolute; left: 50%; top: 0; transform: translateX(-50%); color: #ffd400;
          font-size: 32px; font-weight: bold; animation: up 1.2s ease-out forwards; pointer-events: none; }
  @keyframes up { to { top: -48px; opacity: 0; } }
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <h1 id="headline"></h1>
  <p class="rule" id="rule"></p>

  <a class="player thumb" id="watch" style="margin-top:20px" rel="noopener"><img id="thumb" alt=""><span class="play"></span><span class="cap">YouTube で見る</span></a>
  <p class="label" id="title"></p>
  <a class="sub" id="sub" rel="noopener" hidden></a>

  <div class="box" style="position:relative">
    <div class="label">現在の再生数</div>
    <div style="font-size:64px;font-weight:bold"><span id="views">0</span><span class="goal" id="goal"></span></div>
    <div id="left"></div>
    <div class="bar" id="barwrap"><div id="bar"></div></div>
    <div id="next"></div>
  </div>
  <div id="milestone"></div>

  <div class="box">
    <div class="label">締め切りまで</div>
    <div id="countdown">--:--:--</div>
    <div id="result"></div>
  </div>

  <a id="share" class="share" target="_blank" rel="noopener">𝕏 で応援ポストする</a>

  <div class="box" id="punishBox" hidden>
    <div class="label">罰ゲームはこんな感じでやります</div>
    <a class="player thumb" id="punishWatch" style="margin-top:12px" rel="noopener"><img id="punishThumb" alt=""><span class="play"></span><span class="cap">YouTube で見る</span></a>
  </div>

  <div class="box" id="recordBox" hidden>
    <div class="label">これまでの戦績</div>
    <ul id="records"></ul>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
let cfg, real = 0, localPlays = 0, shown = 0, anim = null;

function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }

function render(target) {
  const el = document.getElementById('views');
  cancelAnimationFrame(anim);
  const from = shown, t0 = performance.now(), dur = from === 0 ? 1500 : 800;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    shown = from + (target - from) * (1 - Math.pow(1 - p, 3));
    el.textContent = fmt(shown);
    if (p < 1) anim = requestAnimationFrame(step); else shown = target;
  })(t0);
  const rest = cfg.target - target;
  document.getElementById('left').textContent =
    rest > 0 ? `あと ${fmt(rest)} 回` : `目標突破！`;
  document.getElementById('goal').textContent = ' / ' + fmt(cfg.target);
  document.getElementById('bar').style.width = Math.min(100, target / cfg.target * 100) + '%';
  milestones(Math.round(target));
}

// 節目: 目標の 25%・50%・75%・100% で「○○回突破！」を出す（config の milestones で変えられる）。
// 一度見た節目はその端末では出し直さない
const MS_KEY = () => 'ms_' + cfg.videoId;
function msList() { return (cfg.milestones || [0.25, 0.5, 0.75, 1]).map(f => Math.round(cfg.target * f)); }
function milestones(v) {
  const list = msList(), wrap = document.getElementById('barwrap');
  if (!wrap.querySelector('.tick')) list.filter(m => m < cfg.target).forEach(m => {
    const t = document.createElement('div'); t.className = 'tick'; t.style.left = (m / cfg.target * 100) + '%'; wrap.appendChild(t);
  });
  const nx = list.find(m => m > v);
  document.getElementById('next').textContent = nx && nx < cfg.target ? `次の節目 ${fmt(nx)} 回まで あと ${fmt(nx - v)} 回` : '';
  const hit = list.filter(m => m <= v).pop();
  if (!hit || new Date(cfg.deadline) <= Date.now()) return;
  let seen = 0; try { seen = Number(localStorage.getItem(MS_KEY())) || 0; } catch (_) {}
  if (hit <= seen) return;
  try { localStorage.setItem(MS_KEY(), hit); } catch (_) {}
  const el = document.getElementById('milestone');
  el.innerHTML = hit >= cfg.target ? `目標達成！<small>${fmt(hit)}回突破・罰ゲーム回避！</small>`
                                   : `${fmt(hit)}回突破！<small>目標まで あと ${fmt(cfg.target - v)} 回</small>`;
  el.classList.add('on'); celebrate(hit >= cfg.target);
  setTimeout(() => el.classList.remove('on'), 3500);
}

function display() { return real + localPlays; }

// 見込み = 今の数 + (開始からの平均の伸び) × 残り時間。見込み÷目標で背景の段を決める
// URL に ?stage=hell 等を付けると、その段を見比べ用に固定で出す
const forced = new URLSearchParams(location.search).get('stage');
function pickStage() {
  const st = cfg.stages, now = Date.now();
  if (forced) return st.find(s => s.key === forced) || st[0];
  const start = new Date(cfg.start), end = new Date(cfg.deadline);
  if (now >= end) return real >= cfg.target ? st[0] : st[st.length - 1];
  const rate = real / Math.max(1, now - start);
  const ratio = (real + rate * (end - now)) / cfg.target;
  return st.find(s => ratio >= s.minRatio) || st[st.length - 1];
}
let curStage = null;
function applyStage() {
  const s = pickStage();
  if (s.key === curStage) return;
  curStage = s.key;
  document.getElementById('bg').style.backgroundImage = `url(bg/${s.key}.jpg)`;
  document.body.dataset.stage = s.key;
  // 段に入った瞬間の演出: 天国・金は紙吹雪、地獄は画面が揺れる
  if (s.key === 'heaven') celebrate(true);
  else if (s.key === 'gold') celebrate(false);
  else if (s.key === 'hell') {
    document.body.classList.remove('shake'); void document.body.offsetWidth;
    document.body.classList.add('shake');
  }
}

function celebrate(big) {
  if (!window.confetti) return;
  // 金の背景に埋もれないよう、金に赤・青・桃を混ぜて大きめに降らせる
  const colors = ['#ffd700', '#ffffff', '#ff4d6d', '#4dabff', '#ff9ff3'];
  const o = { colors, scalar: 1.6, ticks: 300 };
  confetti({ ...o, particleCount: big ? 160 : 70, spread: 100, origin: { y: 0.3 } });
  if (big) setTimeout(() => {
    confetti({ ...o, particleCount: 80, angle: 60, spread: 70, origin: { x: 0, y: 0.6 } });
    confetti({ ...o, particleCount: 80, angle: 120, spread: 70, origin: { x: 1, y: 0.6 } });
  }, 400);
}

function fill(t, vars) { return t.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? ''); }

function updateShare(leftText) {
  const ended = new Date(cfg.deadline) <= Date.now();
  const vars = {
    rest: fmt(Math.max(0, cfg.target - display())), target: fmt(cfg.target), views: fmt(real),
    left: leftText, result: real >= cfg.target ? '罰ゲーム回避！' : '罰ゲーム確定…',
    video: cfg.videoUrl || 'https://www.youtube.com/shorts/' + cfg.videoId
  };
  // ページの URL は文の中（{page}）に入れ、動画の URL を最後に置く。
  // X は最後の URL のカードを出すので、YouTube のサムネ付きカード（X の中で再生もできる）が出る
  vars.page = location.origin + location.pathname;
  const text = fill(ended ? cfg.shareTextEnd : cfg.shareText, vars);
  document.getElementById('share').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text);
}

function ytId(u) { const m = (u || '').match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{11})/); return m && m[1]; }

function renderExtras() {
  const pid = ytId(cfg.punishVideoUrl);
  if (pid) {
    setThumb(document.getElementById('punishWatch'), document.getElementById('punishThumb'), pid, cfg.punishVideoUrl);
    document.getElementById('punishBox').hidden = false;
  }
  const recs = (cfg.records || []).slice().sort((a, b) => b.no - a.no);
  if (!recs.length) return;
  const ul = document.getElementById('records');
  recs.forEach(r => {
    const li = document.createElement('li'), win = r.views >= r.target;
    li.dataset.no = r.no;
    // 小さいサムネ（押すと本編と同じく YouTube へ。スマホはアプリ）
    const id = ytId(r.url);
    const th = document.createElement('a'); th.className = 'rthumb'; th.rel = 'noopener';
    const im = document.createElement('img'); im.alt = ''; th.appendChild(im);
    if (id) setThumb(th, im, id, r.url);
    const a = document.createElement('a'); a.href = th.href || r.url; a.target = th.target; a.rel = 'noopener';
    a.textContent = r.title; a.className = 'rtitle';
    const res = document.createElement('span'); res.className = win ? 'win' : 'lose';
    if (win) res.textContent = '回避';
    else { const pu = document.createElement('span'); pu.className = 'punish'; pu.textContent = r.punish; res.append('罰ゲーム（', pu, '）'); }
    const num = document.createElement('div'); num.className = 'rnum';
    num.innerHTML = `<b>${fmt(r.views)}</b> / ${fmt(r.target)} 回`;
    const body = document.createElement('div'); body.className = 'rbody';
    body.append(`第${r.no}回`, document.createElement('br'), a, num, res);
    li.append(th, body);
    ul.appendChild(li);
  });
  document.getElementById('recordBox').hidden = false;
}

async function poll() {
  try {
    const d = await (await fetch('data.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (d.views > real) { localPlays = Math.max(0, localPlays - (d.views - real)); real = d.views; }
    render(display());
    // 段ごとの背景と演出は config の stageBackgrounds が true の時だけ（?stage= の見比べは常に可）
    if (cfg.stageBackgrounds || forced) applyStage();
  } catch (e) { console.log('[batsu] poll failed', e); }
}

function tick() {
  const ms = new Date(cfg.deadline) - Date.now();
  const cd = document.getElementById('countdown');
  if (ms <= 0) {
    cd.textContent = '集計終了';
    const ok = real >= cfg.target;
    document.getElementById('result').textContent = ok ? '目標達成！罰ゲーム回避' : '目標未達…罰ゲーム確定';
    updateShare('');
    return;
  }
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
  const hh = String(Math.floor(s % 86400 / 3600)).padStart(2, '0');
  const mm = String(Math.floor(s % 3600 / 60)).padStart(2, '0');
  const ss = String(s % 60).padStart(2, '0');
  cd.textContent = (d ? d + '日 ' : '') + `${hh}:${mm}:${ss}`;
  updateShare(d ? `${d}日${Math.floor(s % 86400 / 3600)}時間` : `${Math.floor(s / 3600)}時間${Math.floor(s % 3600 / 60)}分`);
}

// 動画はページ内で再生せず、普通のリンクで YouTube へ渡す。
// スマホ: 同じタブで開く＝YouTube アプリを入れている人はアプリが開く（ログイン中のアカウントで見られる）
// パソコン: 今見ているブラウザの新しいタブで開く（別のブラウザは開かない）
const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
function setThumb(a, img, id, url) {
  a.href = url || 'https://www.youtube.com/shorts/' + id;
  if (!touch) a.target = '_blank';
  img.src = 'https://i.ytimg.com/vi/' + id + '/oardefault.jpg';   // ショートの縦長サムネ
  img.onerror = () => { img.onerror = null; img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; };
}

function bump() {
  localPlays++;
  render(display());
  const v = document.getElementById('views');
  v.classList.add('bump'); setTimeout(() => v.classList.remove('bump'), 1200);
  const p = document.createElement('div');
  p.className = 'plus'; p.textContent = '+1';
  v.parentElement.appendChild(p); setTimeout(() => p.remove(), 1300);
}

(async () => {
  cfg = await (await fetch('config.json', { cache: 'no-store' })).json();
  document.title = cfg.headline;
  // 見出しは config の | で行を分ける（1行ごとに折り返さない）
  const h = document.getElementById('headline');
  cfg.headline.split('|').forEach(line => {
    const s = document.createElement('span');
    s.className = 'line'; s.textContent = line; h.appendChild(s);
  });
  document.title = cfg.headline.replace(/\|/g, '');
  document.getElementById('rule').textContent = cfg.rule;
  document.getElementById('title').textContent = cfg.videoTitle;
  if (forced !== null) {
    const bar = document.createElement('div'); bar.id = 'stagebar';
    cfg.stages.forEach(s => {
      const b = document.createElement('button'); b.textContent = s.name;
      b.onclick = () => { location.search = '?stage=' + s.key; };
      bar.appendChild(b);
    });
    document.body.appendChild(bar);
  }
  // サムネを押したらページ上だけ +1（YouTube 側の本当の数字は次の取得で揃える）
  const watch = document.getElementById('watch');
  setThumb(watch, document.getElementById('thumb'), cfg.videoId, cfg.videoUrl);
  watch.addEventListener('click', () => { if (new Date(cfg.deadline) > Date.now()) bump(); });
  // 依頼者のチャンネル登録（?sub_confirmation=1 で登録の確認が出る）
  if (cfg.channel && cfg.channel.url) {
    const sub = document.getElementById('sub');
    sub.href = cfg.channel.url.replace(/\/$/, '') + '?sub_confirmation=1';
    if (!touch) sub.target = '_blank';
    sub.textContent = (cfg.channel.name ? cfg.channel.name + 'さんの' : '') + 'チャンネルを登録';
    sub.hidden = false;
  }
  renderExtras();
  tick(); setInterval(tick, 1000);
  await poll(); setInterval(poll, cfg.pollSeconds * 1000);
})();
</script>
</body>
</html>
