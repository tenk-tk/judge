  .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; font-weight: 400; }

  #cheer { position: relative; z-index: 2; display: inline-block; max-width: 92%; box-sizing: border-box; margin: 30px auto -6px;

  #cheer[hidden], #pace[hidden] { display: none; }   /* 上の display 指定が hidden に勝って空の吹き出しが出たので明示する */

  /* ===== 再生数のゲージ（事前登録の達成報酬・キャンディクラッシュのスターメーター風。10-31 佐藤さん「ポップに」） =====
     ゲージが伸びて、節目（目標÷4ずつ）の星に届くと、星が弾んで色が付き「○回 達成！」の吹き出しが出る。
     下に節目のカードを並べ、届いた所に「達成」の判子を押す（事前登録サイトの「達成済み」と同じ見せ方） */
  .meter { position: relative; margin: 52px 26px 6px; }
  .mtrack { height: 24px; border-radius: 999px; background: #2b2540; border: 3px solid #3b1c00;
            box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 3px 0 #3b1c00; overflow: hidden; }
  .mfill { height: 100%; width: 0; border-radius: 999px; transition: width 1s cubic-bezier(.3,1.4,.5,1);
           background: repeating-linear-gradient(-45deg, rgba(255,255,255,.28) 0 8px, rgba(255,255,255,0) 8px 16px),
                       linear-gradient(90deg, #ff6fae, #ffb03b);
           background-size: 22.6px 22.6px, 100% 100%; animation: stripes .8s linear infinite;
           box-shadow: inset 0 4px 0 rgba(255,255,255,.35); }
  .meter.max .mfill { background: repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 8px, rgba(255,255,255,0) 8px 16px),
                                  linear-gradient(90deg, #ffe066, #ffb800, #ffe066); background-size: 22.6px 22.6px, 100% 100%; }
  @keyframes stripes { to { background-position: 22.6px 0, 0 0; } }
  .mstar { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
           display: flex; align-items: center; justify-content: center; border: 3px solid #3b1c00;
           background: #5c5675; box-shadow: 0 3px 0 #3b1c00; font-size: 22px; color: #8d88a3; line-height: 1; }
  .mstar .lock { position: absolute; right: -6px; bottom: -6px; font-size: 14px; }
  .mstar .val { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); white-space: nowrap;
                font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 11px; color: #aaa; }
  .mstar.done { background: radial-gradient(circle at 35% 30%, #fff6a8, #ffc400 60%, #ff9d00); color: #fff;
                -webkit-text-stroke: 2px #c25b00; paint-order: stroke fill; }
  .mstar.done .lock { display: none; }
  .mstar.done .val { color: #ffe14d; }
  .mstar.pop-now { animation: starpop .9s cubic-bezier(.2,2,.4,1); }
  @keyframes starpop { 0% { transform: scale(.4) rotate(-40deg); } 60% { transform: scale(1.5) rotate(10deg); } 100% { transform: none; } }
  .mbubble { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%) scale(.2); opacity: 0; z-index: 3;
             white-space: nowrap; padding: 6px 14px 8px; border: 3px solid #3b1c00; border-radius: 16px; background: #fff;
             color: #ff2f78; font-size: 15px; box-shadow: 0 4px 0 #3b1c00; pointer-events: none;
             transition: transform .45s cubic-bezier(.2,1.9,.4,1), opacity .2s; }
  .mbubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
                    border-style: solid; border-width: 12px 9px 0 9px; border-color: #3b1c00 transparent transparent transparent; }
  .mbubble.on { opacity: 1; transform: translateX(-50%) scale(1); }
  .mstar.last .mbubble { left: auto; right: -14px; transform: scale(.2); transform-origin: right bottom; }
  .mstar.last .mbubble.on { transform: scale(1); }
  .mstar.last .mbubble::after { left: auto; right: 22px; transform: none; }
  #next { font-size: 14px; color: #eee; margin-top: 30px; }
  #next b { font-size: 1.35em; color: #ffb03b; }

  /* このままだと食べる虫の数（節目を超えるごとに1匹減る） */
  .bugs { margin: 18px auto 0; padding: 12px 10px 10px; max-width: 360px; border: 3px solid #3b1c00; border-radius: 18px;

  .bugs-label { font-size: 13px; color: #c2185b; }
  .bugs-row { display: flex; justify-content: center; gap: 4px; margin: 8px 0 4px; }
  /* 虫の絵は佐藤さんの素材（かいねこ\2_素材\05_画像\mushi_imomushi.png を縮めて img_imomushi.png に置いた・11-01） */
  .bug { position: relative; width: 70px; height: 46px; display: flex; align-items: center; justify-content: center; }
  .bug img { width: 100%; height: 100%; object-fit: contain; }
  .bug.gone img { filter: grayscale(1); opacity: .35; }
  .bug.gone::after { content: ""; position: absolute; left: 50%; top: 50%; width: 90%; height: 4px; border-radius: 2px; background: #e8213f;
                     transform: translate(-50%, -50%) rotate(-35deg); }
  .bug .off { display: none; position: absolute; right: -10px; top: -10px; padding: 1px 5px; border-radius: 999px; background: #e8213f; color: #fff;
              font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 11px; border: 2px solid #fff; filter: none; }
  .bug.gone .off { display: block; }
  .bug.gone-now { animation: bugout .7s cubic-bezier(.3,1.6,.5,1); }

  .mcard .stamp { display: none; position: absolute; right: -12px; bottom: -14px; width: 40px; height: 40px; border-radius: 50%;

                  font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 13px; line-height: 1; letter-spacing: 0;
                  transform: rotate(-12deg); }
  .mcard.done .stamp { display: flex; }
  .mcard.stamp-now .stamp { animation: stamp .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes stamp { 0% { transform: scale(3) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }

  /* このままだと届かない／届きそう（今の伸び方から締め切りの見込みを出す） */
  #pace { display: inline-block; margin-top: 12px; padding: 8px 16px; border: 3px solid #3b1c00; border-radius: 16px;

  #pace.good { background: #ffd400; color: #3b1c00; }

<script>
// 行ごとに折り返さない見出しが、画面の幅に収まるよう文字を縮める（本番と同じ）
function fitLines(box) {
  box.style.fontSize = '';
  const max = box.clientWidth, lines = [...box.querySelectorAll('.line:not(.note)')];   // 「※」の小さい行は幅に数えず折り返す（11-05 長い注記で見出しまで小さくなった）
  const widest = Math.max(...lines.map(l => { l.style.display = 'inline-block'; const w = l.getBoundingClientRect().width; l.style.display = ''; return w; }));
  const grow = cfg && cfg.creed ? 1.7 : 1;   // 三箇条を出す版は見出しを幅いっぱいまで大きくする（本番の形は今のまま）
  if (widest > max || grow > 1) box.style.fontSize = (parseFloat(getComputedStyle(box).fontSize) * Math.min(grow, max / widest) * 0.98) + 'px';
  // 「※」の行は1行ずつ幅に収める（折り返して1字だけ残るのを防ぐ）
  box.querySelectorAll('.line.note').forEach(l => { l.style.fontSize = ''; l.style.display = 'inline-block'; const w = l.getBoundingClientRect().width; l.style.display = '';
    if (w > max) l.style.fontSize = (parseFloat(getComputedStyle(l).fontSize) * max / w * 0.98) + 'px'; });
}
// ふわっと出す＋右下の「ルール詳細」（本番と同じ）。ボタンは再生数の枠がどれか見えたら消す。押すと今見ている企画の再生数の枠へ移る
function setupFade() {
  const btn = document.getElementById('ruleBtn'), boxes = [...document.querySelectorAll('.camp .cbox')];
  document.querySelectorAll('.camp').forEach(el => el.classList.add('fade'));
  let btnDone = false;
  const hideBtn = () => { if (btnDone) return; btnDone = true; btn.classList.remove('on'); btn.classList.add('gone'); };
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (!x.isIntersecting) return;
    if (x.target.classList.contains('cbox')) { hideBtn(); io.unobserve(x.target); return; }
    x.target.classList.add('show'); io.unobserve(x.target);
  }), { threshold: .15 });
  document.querySelectorAll('.fade').forEach(el => io.observe(el));
  boxes.forEach(b => io.observe(b));
  btn.onclick = () => {
    hideBtn();
    const camps = document.getElementById('camps'), mid = camps.getBoundingClientRect().left + camps.clientWidth / 2;
    const b = boxes.reduce((a, x) => Math.abs(x.getBoundingClientRect().left + x.offsetWidth / 2 - mid) < Math.abs(a.getBoundingClientRect().left + a.offsetWidth / 2 - mid) ? x : a);
    b.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
  };
  setTimeout(() => { if (!btnDone) btn.classList.add('on'); }, 1400);
}
const fmt = n => Math.round(n).toLocaleString('ja-JP');

};

// こだわりの文の中の URL を押せるリンクにする（11-23 佐藤さん「こだわりに張ってるリンクはクリックしたら飛べるようにして」）。編集モードでは文のまま（書き換えを崩さない）
// sato-said:「OK！それ先に導入しておいて！あとから文章修正する」(11-23 [m:ss] のタイムコード)
function noteFill(el, text) {
  el.textContent = '';
  if (document.getElementById('ed')) { el.textContent = text; return; }
  const re = /https?:\/\/[^\s　［\[]+|[\[［](\d{1,2})[:：]([0-5]\d)[\]］]/g; let last = 0, m;
  while ((m = re.exec(text))) {
    el.append(text.slice(last, m.index));
    const a = document.createElement('a');
    if (m[1] !== undefined) {
      a.className = 'tc'; a.dataset.t = String(+m[1] * 60 + +m[2]);
      a.textContent = +m[1] + ':' + m[2]; a.tabIndex = 0; a.setAttribute('role', 'button');
      a.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.click(); } };
    } else {
      a.href = m[0]; a.textContent = m[0]; a.target = '_blank'; a.rel = 'noopener'; a.className = 'cn-link';
      a.onclick = e => e.stopPropagation();
    }
    el.append(a); last = m.index + m[0].length;
  }
  el.append(text.slice(last));
}

  // 前の説明: ショートの縦長サムネ → 無ければ普通のサムネ。予約投稿の前に開いた端末には YouTube の灰色の仮の絵（120×90）が
  // 残ることがあるので、仮の絵が来た時は時刻を付けて取り直す（10-31 罰ゲームの動画で19時の公開後も替わらなかった）
  const urls = ['maxresdefault', 'sddefault', 'hqdefault'].map(n => 'https://i.ytimg.com/vi/' + id + '/' + n + '.jpg');
  let i = 0, retried = false;
  const next = () => {
    if (i < urls.length) { img.src = urls[i++]; return; }
    if (!retried) { retried = true; i = 0; const t = '?t=' + Math.floor(Date.now() / 600000); urls.forEach((u, k) => urls[k] = u + t); next(); }
  };
  img.onerror = next;
  img.onload = () => { if (img.naturalWidth <= 120) next(); };
  next();
}

// 11-24 佐藤さん「いろんなところを手動で調整できるようにしてほしい最低限テロップは全部大きさ位置文言は常に修正できる状態に…新しいテロップUIの追加もできるように」:
// 編集モードで選んだ所の大きさ（config の partLook の sz ％）と位置（dx・dy px）。スマホの幅（760px 以下）は sz_sp・dx_sp・dy_sp。足した文字は addTexts
function applyLook() {
  let st = document.getElementById('partsLook');
  if (!st) { st = document.createElement('style'); st.id = 'partsLook'; document.head.appendChild(st); }
  const selOf = k => PARTS[k] ? PARTS[k][0] : (k.startsWith('sel:') ? k.slice(4).split('##')[0] : (k.startsWith('#') ? k : null));
  const rule = (s, v, sp) => {
    const z = v['sz' + sp], x = v['dx' + sp], y = v['dy' + sp], a = [];
    if (z != null) a.push('zoom:' + (+z / 100));
    if (x != null || y != null) a.push(`translate:${+x || 0}px ${+y || 0}px`);
    return a.length ? s + '{' + a.join(';') + '}' : '';
  };
  const lk = (typeof cfg !== 'undefined' && cfg && cfg.partLook) || {}, pc = [], sp = [];
  for (const [k, v] of Object.entries(lk)) { const s = selOf(k); if (!s || !v) continue; pc.push(rule(s, v, '')); sp.push(rule(s, v, '_sp')); }
  st.textContent = pc.join('\n') + '\n@media (max-width:760px){' + sp.join('\n') + '}';
  document.querySelectorAll('.atx').forEach(e => { if (!e.isContentEditable || !e.matches(':focus')) e.remove(); });

    Object.assign(e.style, { left: (a.x ?? 50) + '%', top: (a.y ?? 40) + 'px', fontSize: (a.s || 28) + 'px', color: a.c || '#ffffff' });
    host.appendChild(e);
  }
}

function Loff(k) { return L(k, k in LD ? LD[k] : null) === ''; }   // 編集モードでも出さない（11-09 数字だけ残って「消せない」に見えた）
function ptTarget(c) { const P = cfg.points; return c.subs ? Math.max(P.targetMin, Math.round(c.subs * P.targetPerSub)) : c.target; }
// 終わった企画を順に足し引き。目標に届かない本が outsFor 回続いたら outPenalty を引いてアウトを0に戻す。目標を超えたらアウトは0
// ストックは「スタートからいちばん下がった所」までに stockEvery の線をいくつ下回ったか（戻っても消えない）。月末に抽選した分は settledStocks で引く
function ptCompute(hist) {
  const P = cfg.points;
  let pts = P.startPoints, outs = 0, low = pts;
  hist.forEach(h => {

    pts += d;
    if (d < 0) { outs++; if (P.outsFor && outs >= P.outsFor) { pts -= P.outPenalty; outs = 0; } } else outs = 0;
    low = Math.min(low, pts);

  const total = Math.min(Math.ceil(P.startPoints / P.stockEvery) - 1, Math.floor((P.startPoints - Math.max(0, low)) / P.stockEvery));   // 0点の線は最強罰ゲームなのでストックに数えない
  return { pts, outs, stocks: Math.max(0, total - (P.settledStocks || 0)), crossed: total };
}

let ptShown = null, ptPrevOuts = 0;
function ptPaint() {

  const SPAN = Math.min(max, P.meterSpan || 60000), stp = P.stockEvery;

  document.querySelectorAll('#pmeter .pscale, #pmeter .ptick').forEach(e => place(e, +e.dataset.p));
  const ps = document.querySelector('#pmeter .pstart'); if (ps) place(ps, P.startPoints);
  const pz = document.querySelector('#pmeter .pzero'); if (pz) pz.style.display = lo === 0 ? '' : 'none';
  const pg = document.querySelector('#pmeter .pgoal'); if (pg) pg.style.display = hi === max ? '' : 'none';
  const ez = document.querySelector('#pmeter .pend.zero'), eg = document.querySelector('#pmeter .pend.goal');
  if (ez) { ez.querySelector('b').textContent = fmt(lo); ez.querySelector('span').style.display = lo === 0 ? '' : 'none'; }
  if (eg) { eg.querySelector('b').textContent = fmt(hi); eg.querySelector('span').style.display = hi === max ? '' : 'none'; }
  const from = ptShown == null ? pts : ptShown, t0 = performance.now(); ptShown = pts;
  const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); $('pnum').textContent = fmt(from + (pts - from) * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  $('pfill').style.width = pct(pts) + '%';
  $('pfill').style.setProperty('--full', (100 / Math.max(.01, pct(pts) / 100)) + '%');   // 色の流れはメーター全体に対して固定
  $('pnow').style.left = pct(pts) + '%';
  $('pfill').style.setProperty('--lv', pct(pts) + '%'); $('pnow').style.setProperty('--pos', pct(pts) + '%');   // 縦のメーター用（11-07）
  // 液体の色: スタートで青紫、減るほど赤へ。ライフがスタートの15%を切ると真っ赤（11-07 佐藤さん「ギリギリだと液体が真っ赤になる感じ」）

  [['--lq1', [205, 220, 255, .48], [255, 190, 190, .55]], ['--lq2', [140, 155, 255, .38], [255, 70, 85, .5]], ['--lq3', [115, 95, 240, .46], [215, 20, 45, .6]],
   ['--lq4', [70, 40, 180, .66], [140, 5, 20, .78]], ['--lqs', [45, 25, 150, .6], [110, 0, 15, .7]]].forEach(([k, a, b]) => $('pfill').style.setProperty(k, mix(a, b)));
  if (document.body.classList.contains('heromode')) $('pmeter').querySelector('.ptrack').style.boxShadow = `inset 0 0 12px rgba(0,0,0,.9), 0 0 ${26 + rt * 14}px ${mix([120, 110, 255, .22], [255, 30, 50, .45])}`;
  // 集計中の企画が「このまま終わると」
  const live = cfg.campaigns.filter(c => c.v != null), g = live.reduce((a, c) => a + (c.v - c.target), 0), gb = $('pghostbar');

function ptMonthEnd() { const j = new Date(Date.now() + 9 * 3600e3); return Date.UTC(j.getUTCFullYear(), j.getUTCMonth() + 1, 0, 14, 59, 0); }   // 月末 23:59（日本時間）
function paintPt(c, v) {

function paint(c, v) {
  if (cfg.points) return paintPt(c, v);
  const el = c.el, list = c.list;
  el.querySelector('.v').textContent = fmt(v);
  el.querySelector('.cleft').textContent = v >= c.target ? '目標突破！' : `あと ${fmt(c.target - v)} 回`;
  el.querySelector('.mfill').style.width = Math.min(100, v / c.target * 100) + '%';
  el.querySelector('.meter').classList.toggle('max', v >= c.target);
  const stars = el.querySelectorAll('.mstar'), cs = el.querySelector('.mcards').children, bugs = el.querySelector('.bugs-row').children;
  const done = list.filter(m => v >= m).length, left = list.length - done;
  list.forEach((m, i) => {
    stars[i].classList.toggle('done', v >= m);
    cs[i].classList.toggle('done', v >= m);
    cs[i].querySelector('.rest').textContent = v >= m ? '' : `あと${fmt(m - v)}回`;
    bugs[i].classList.toggle('gone', i < done);
  });
  el.querySelector('.bugs').classList.toggle('zero', left === 0);
  el.querySelector('.bugs-count').innerHTML = left > 0 ? `<b>${left}</b> ${c.P.unit}` : `<b>0</b> ${c.P.unit}！ 食べなくていい！`;
  const nx = list.find(m => m > v);
  el.querySelector('.next').innerHTML = nx ? `次の${c.P.name}軽減まで あと <b>${fmt(nx - v)}</b> 回` : `<b>${c.P.name}ゼロ達成！</b> ほんとにありがとう！`;
}

async function pollAll() {

// スマホのスワイプ: 下の点と今見ている企画を揃える
function setupDots() {

    const mid = camps.scrollLeft + camps.clientWidth / 2;
    let best = 0, bd = 1e9;
    cfg.campaigns.forEach((c, i) => { const x = c.el.offsetLeft + c.el.offsetWidth / 2 - camps.offsetLeft; const dd = Math.abs(x - mid); if (dd < bd) { bd = dd; best = i; } });

// タブ（11-07 佐藤さん「最初のページで興味付けさせることに全力を注いで、他はタブ作って各ページに飛ばす」「詳細なルールは別タブ、こだわりもいきなり出てきたら押しつけがましいから別タブ」）。
// 同じページの中で切り替える（X に貼るリンクは1本のまま）。#tab-rules のように付けて開くとそのタブから始まる
function setupTabs() {
  document.body.classList.add('tabmode');
  const main = document.querySelector('main');
  // 制作のこだわりは企画の枠から抜き出し、こだわりのタブへ1本ずつ並べる
  const kt = document.createElement('section'); kt.id = 'kodaTab';
  // 2段階（11-09 佐藤さん「こだわりのタブを選んだら。動画のタイトルとサムネが出てきて。一覧が選べる…一つ選んだら…この切り抜きの制作でこだわったことっていうのが出てくるようにしたい」）
  // 1段目＝サムネとタイトルの一覧（.klist）／2段目＝選んだ1本の動画＋こだわり（.ktab-item）。「一覧へ戻る」で1段目へ
  const kh = document.createElement('div'); kh.className = 'klist-title'; kh.textContent = '動画を選ぶと、伸ばすためにしたことが見られます';   // sato-said:「伸ばすための意識　にタブを変えて　ここも、動画を選ぶと、伸ばすためにしたことが見られます　　にして」(11-23)
  const kl = document.createElement('div'); kl.className = 'klist';
  const kback = document.createElement('button'); kback.type = 'button'; kback.className = 'ktab-back'; kback.textContent = '← 動画一覧へ戻る';
  kback.onclick = () => { kodaShow(null); scrollTo({ top: 0, behavior: 'instant' }); };
  kt.append(kh, kl, kback);
  function kodaShow(vid) {
    const list = !vid;
    kh.style.display = kl.style.display = list ? '' : 'none';
    kback.style.display = list ? 'none' : '';
    kt.querySelectorAll('.ktab-item').forEach(e => { e.style.display = e.dataset.vid === vid ? '' : 'none'; });
  }
  // 終わった企画のこだわりも一覧に足す（11-09 佐藤さん「ダイヤさんのポピープレイタイム3のやつとクリシアさんの同意したい前編のこだわりもかけるようにして」）。
  // config の kodaExtra（videoId・videoTitle・note）から、企画の枠と同じ「この切り抜きの制作でこだわったこと」の欄を作る
  // 締め切りを過ぎて並びから外れた企画のこだわりも、kodaExtra に無ければ一覧の先頭へ足す（11-12 佐藤さん「こだわりも2個抜けてるよ？6個書いてるはず」）
  const kodaHas = new Set((cfg.kodaExtra || []).map(x => x.videoId));
  const kodaEnded = (cfg.ended || []).filter(c => !kodaHas.has(c.videoId) && (c.note || '').trim()).reverse();
  const kodaExtra = [...kodaEnded, ...(cfg.kodaExtra || [])].filter(x => (x.note || '').trim() || document.getElementById('ed')).map(x => {   // 空のこだわりは普通のページでは出さない（11-09）
    const el = document.createElement('div');
    const nb = document.createElement('div'); nb.className = 'cnote';
    nb.innerHTML = '<div class="cn-title">この切り抜きを伸ばすために意識したこと</div><div class="cn-text" data-ph="ここに制作時のこだわりを書きます"></div>';
    noteFill(nb.querySelector('.cn-text'), x.note || ''); el.appendChild(nb);
    return { videoId: x.videoId, videoTitle: x.videoTitle, el, extra: true };
  });
  // sato-said:「OK！それ先に導入しておいて！あとから文章修正する」(11-23 [m:ss] のタイムコード)
  const tcPlayers = new Map();
  const tcSend = (fr, func, args = []) => fr.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), 'https://www.youtube.com');
  const tcHello = fr => fr.contentWindow.postMessage(JSON.stringify({ event: 'listening' }), 'https://www.youtube.com');
  function tcRegister(fr) {
    const p = { playerState: -1, pending: null }; tcPlayers.set(fr, p);
    fr.addEventListener('load', () => { p.playerState = -1; tcHello(fr); setTimeout(() => tcHello(fr), 800); });
  }
  addEventListener('message', e => {
    if (e.origin !== 'https://www.youtube.com') return;
    const fr = [...tcPlayers.keys()].find(f => f.contentWindow === e.source);
    if (!fr) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (_) { return; }
    if (!d) return;
    const p = tcPlayers.get(fr), s = d.event === 'onStateChange' ? d.info : (d.info && d.info.playerState);
    if (typeof s === 'number') {
      p.playerState = s;
      if (s === 1 && p.pending != null) { const t = p.pending; p.pending = null; tcSend(fr, 'seekTo', [t, true]); }
    }
    if (d.event === 'onReady' && p.pending != null) tcSend(fr, 'playVideo');
  });
  document.addEventListener('click', e => {
    const a = e.target.closest('.cnote .tc');
    if (!a || document.getElementById('ed')) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const owner = a.closest('[data-vid]'), videoId = owner && owner.dataset.vid;
    if (!videoId) return;
    const item = [...kt.querySelectorAll('.ktab-item')].find(x => x.dataset.vid === videoId);
    const fr = item && item.querySelector('iframe'), p = tcPlayers.get(fr);
    if (!p) return;
    if (!a.closest('.ktab-item')) { go('koda', true); kodaShow(videoId); }
    document.querySelectorAll('.tc.on').forEach(x => x.classList.remove('on')); a.classList.add('on');
    item.querySelectorAll('.tc').forEach(x => x.classList.toggle('on', x.dataset.t === a.dataset.t));
    const seconds = +a.dataset.t, t = Math.max(0, seconds - 1);
    tcHello(fr);
    if (p.playerState === 1 || p.playerState === 2) { p.pending = null; tcSend(fr, 'seekTo', [t, true]); tcSend(fr, 'playVideo'); }
    else { p.pending = t; tcSend(fr, 'playVideo'); }
    try { gtag('event', 'jd_tc_' + videoId + '_' + seconds, {transport_type:'beacon'}); } catch (_) {}
  }, true);
  const kodaSeen = new Set();
  [...cfg.campaigns, ...kodaExtra].forEach(c => {
    if (!c.el || kodaSeen.has(c.videoId)) return;
    const parts = [...c.el.querySelectorAll('.cnote, .kodawari')];
    if (!parts.length) return;
    kodaSeen.add(c.videoId);
    const it = document.createElement('div'); it.className = 'ktab-item'; it.dataset.vid = c.videoId;
    const t = document.createElement('a'); t.className = 'ktab-title'; t.rel = 'noopener'; t.textContent = c.videoTitle || '';
    setThumb(t, document.createElement('img'), c.videoId, 'https://www.youtube.com/shorts/' + c.videoId);
    t.textContent = c.videoTitle || '';
    // こだわりの横で動画をページ内再生（11-09 佐藤さん「制作のこだわりのところは絶対隣に動画再生できるようにページを置いてほしい。文章だけだとわからないから」「動画を押しても依頼者様のYouTubeに飛ばずに、このページのまま再生できるようにできる？」）
    // 他の所（トップのカード等）は 10-31 からの「YouTube へ移る」のまま
    const pv = document.createElement('div'); pv.className = 'ktab-video';
    const fr = document.createElement('iframe'); fr.loading = 'lazy'; fr.title = c.videoTitle || '';
    fr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; fr.allowFullscreen = true;
    // sato-said:「OK！それ先に導入しておいて！あとから文章修正する」(11-23 [m:ss] のタイムコード)
    tcRegister(fr);
    fr.src = 'https://www.youtube.com/embed/' + c.videoId + '?playsinline=1&rel=0&enablejsapi=1';
    pv.appendChild(fr);
    const bd = document.createElement('div'); bd.className = 'ktab-body'; bd.append(t, ...parts);
    it.append(pv, bd); kt.appendChild(it);
    // 1段目の一覧のカード（サムネ＋タイトル）。押すとこの動画の2段目へ
    const card = document.createElement('button'); card.type = 'button'; card.className = 'kcard';
    const ci = document.createElement('img'); ci.alt = '';
    setThumb(document.createElement('a'), ci, c.videoId);   // サムネの取り方は動画のカードと同じ（灰色の仮の絵なら次を取る）
    const ct = document.createElement('span'); ct.className = 'kcard-t'; ct.textContent = c.videoTitle || '';
    card.append(ci, ct);
    card.onclick = () => { kodaShow(c.videoId); scrollTo({ top: 0, behavior: 'instant' }); try { gtag('event', 'jd_kodacard_' + c.videoId); } catch (_) {} };
    kl.appendChild(card);
    if (c.extra) return;   // 終わった企画は輪のカードが無い
    // 動画を選ぶ輪のカードに「この動画のこだわり」ボタン（11-08 佐藤さん「動画選択UIのところに、この動画のこだわり って書かれたボタンを用意して、そこからこだわりが見れる」）
    const kb = document.createElement('button'); kb.type = 'button'; kb.className = 'kdbtn'; kb.innerHTML = LS('kdBtn', 'この動画のこだわり');
    kb.onclick = e => { if (!c.el.classList.contains('front') && c.el.closest('.ring')) return; e.preventDefault(); go('koda', true); kodaShow(c.videoId);   // この動画の2段目へ直接
      try { gtag('event', 'jd_kodabtn_' + c.videoId); } catch (_) {} };
    const anchor = c.el.querySelector('.sub') || c.el.querySelector('.ctitle');
    if (anchor) anchor.after(kb); else c.el.appendChild(kb);
  });
  document.querySelector('.extras').before(kt);
  const tabs = [
    ['top', 'トップ', ['#pbox', '#camps', '.testnote']],
    ['rules', '罰ゲームについて', ['#rules']],   // 11-09 佐藤さん「ルールだけじゃ何のことかわかんないから罰ゲームについてにしておいて」
    ['koda', '伸ばすための意識', ['#kodaTab']],   // sato-said:「伸ばすための意識　にタブを変えて」(11-23)
    ['punish', '罰ゲームの様子', ['#punishBox']],   // 11-09 佐藤さん「罰げーむのタブを罰ゲームの様子 にして」
    ['records', '戦績', ['#recordBox']],
  ].filter(([k, , sels]) => sels.some(s => { const e = document.querySelector(s); return e && !e.hidden && (k !== 'koda' || e.querySelector('.ktab-item')); }));
  kodaShow(null);
  const nav = document.createElement('nav'); nav.id = 'tabs';
  // 11-09 佐藤さん「トップっていうタブがいらなくて。一旦タップ（タブ）はページの一番上に持っていって。その後どうするか決める」「三箇条の下はメーターと動画だったでしょう」
  // → トップのボタンは出さない（メーターと動画は「どのタブも開いていない時」の中身）。開いているタブをもう一度押すとメーターと動画へ戻る
  tabs.forEach(([k, label, sels]) => {
    sels.forEach(s => document.querySelectorAll(s).forEach(e => { e.dataset.tab = k; }));
    // 11-09 佐藤さん「トップに戻るタブも追加して。書き方はTOPにして」
    const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = k === 'top' ? 'TOP' : label;
    b.onclick = () => go(k, true); nav.appendChild(b);
  });
  if (typeof NAVP !== 'undefined') nav.querySelectorAll('button').forEach(b => { const o = NAVP[b.dataset.k]; if (!o) return; if (o.t != null) b.textContent = o.t; if (o.c) { b.style.setProperty('color', o.c, 'important'); b.style.setProperty('border-color', o.c, 'important'); } });   // 11-24 配置エディタのタブ
  const cr = document.getElementById('creed'); if (cr) main.before(cr);   // 並び: 冒頭 → 編集三箇条 → メーターと動画（main）
  nav.classList.add('stuck', 'attop');
  document.body.prepend(nav);   // タブはページの一番上
  function go(k, user) {
    document.querySelectorAll('[data-tab]').forEach(e => e.classList.toggle('tab-off', e.dataset.tab !== k));
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    // タブを押したら、そのタブだけのページにする（11-09 佐藤さん「タブを押したら、そのタブ専用のページに行かないとおかしい」）。冒頭・三箇条・メーターと動画は隠す
    document.body.classList.toggle('tabpage', k !== 'top');
    if (k === 'koda' && user) kodaShow(null);   // こだわりのタブを押したら1段目（一覧）から
    if (user) {
      history.replaceState(null, '', k === 'top' ? location.pathname + location.search : '#tab-' + k);
      scrollTo({ top: 0, behavior: 'instant' });
      try { gtag('event', 'jd_tab_' + k); } catch (_) {}
      if (k === 'top') window.dispatchEvent(new Event('resize'));
    }
    document.querySelectorAll('[data-tab="' + k + '"] .fade, [data-tab="' + k + '"].fade').forEach(e => e.classList.add('show'));
  }
  const want = (location.hash.match(/^#tab-(\w+)/) || [])[1];
  go(tabs.some(t => t[0] === want) ? want : 'top');
}

// 企画の動画を輪のように並べる（11-07 佐藤さん「複数出す前提で、プレイヤー選択画面みたいに時計回りに動画が並ぶように」「真ん中に表示中の動画があって、その左右に別の動画が半透明で出る」「クリックしたらそれが正面に回転して出てくる」）
// 文字の大きさと位置を編集モードで動かす枠（11-12 佐藤さん「文字の大きさ調整できるようにして位置も」）。冒頭の枠（.hgap）と同じ口: 数字は data-lbl で保存される
// キーは <key>Sz（%・30〜400・既定100）・<key>X／<key>Y（px・−800〜800・既定0＝元の場所から右／下へ）。スマホの幅（560px 以下）は後ろに _sp の別の数字（パソコンの数字は引き継がない）
// 対象: ライフの下の文（pGhost）・「集計中なし」（cEmpty）。足す時は setupAdjAll() に1行
function setupAdj(dock, e, key, title) {
  if (!e) return;
  const nOf = (t, d, lo, hi) => { const g = parseFloat(t); return isFinite(g) ? Math.max(lo, Math.min(hi, g)) : d; };
  const defs = [[key + 'Sz', '大きさ%', 100, 30, 400, 5, '−', '＋'], [key + 'X', '横の位置px', 0, -800, 800, 5, '◀', '▶'], [key + 'Y', '縦の位置px', 0, -800, 800, 5, '▲', '▼']];
  const gp = document.createElement('div'); gp.className = 'cgap';
  const mq = matchMedia('(max-width: 560px)');
  const build = () => { const sp = mq.matches, K = k => sp ? k + '_sp' : k, N = {}; gp.textContent = '';
    const h = document.createElement('div'); h.className = 'cgh'; h.textContent = title + (sp ? '（スマホ用）' : '') + ' の大きさと位置'; gp.appendChild(h);
    e.style.fontSize = ''; const base = parseFloat(getComputedStyle(e).fontSize) || 16;
    const v = d => nOf(N[d[0]].textContent, d[2], d[3], d[4]);
    const put = () => { const z = v(defs[0]), x = v(defs[1]), y = v(defs[2]);
      e.style.fontSize = z === 100 ? '' : base * z / 100 + 'px'; e.style.transform = x || y ? 'translate(' + x + 'px, ' + y + 'px)' : ''; };
    defs.forEach(d => { const row = document.createElement('div'); row.className = 'cgrow';
      row.innerHTML = '<span class="cgt">' + d[1] + '</span><button type="button" data-d="' + -d[5] + '">' + d[6] + '</button><span data-lbl="' + K(d[0]) + '"></span><button type="button" data-d="' + d[5] + '">' + d[7] + '</button>';
      const n = N[d[0]] = row.querySelector('[data-lbl]'); n.textContent = String(nOf(L(K(d[0]), String(d[2])), d[2], d[3], d[4]));
      row.querySelectorAll('button').forEach(b => b.onclick = () => { n.textContent = String(nOf(v(d) + parseFloat(b.dataset.d), d[2], d[3], d[4])); put(); n.dispatchEvent(new Event('input', { bubbles: true })); });
      n.addEventListener('input', put); gp.appendChild(row); });
    put(); };
  build(); mq.addEventListener('change', build);
  dock.appendChild(gp);
}
function setupAdjAll() {
  const pb = document.getElementById('pbox'); if (!pb) return;
  const dock = document.createElement('div'); dock.id = 'adjdock'; document.body.appendChild(dock);
  setupAdj(dock, document.getElementById('pghost'), 'pGhost', 'ライフの下の文');
  setupAdj(dock, document.querySelector('#camps .cempty'), 'cEmpty', '「集計中なし」');
  if (window.IntersectionObserver) new IntersectionObserver(es => dock.classList.toggle('on', es[0].isIntersecting)).observe(pb); else dock.classList.add('on');
}
function setupRing() {
  const camps = document.getElementById('camps'), list = cfg.campaigns.map(c => c.el), n = list.length;
  if (!n) {   // 集計中が0本の時も、ライフの枠の左へ「集計中なし」を置く（11-12）
    const pb = document.getElementById('pbox');
    if (pb) { const wrap = document.createElement('div'); wrap.className = 'pring'; pb.appendChild(wrap); wrap.append(camps); }
    return;
  }
  camps.classList.add('ring'); camps.classList.remove('solo');
  list.forEach(el => { el.classList.remove('fade'); el.classList.add('show'); });
  // 最初に正面へ出す動画は開くたびにランダム（11-09 佐藤さん「どっちが1番表に出るかはランダムに出来る？今後複数集計になる際はランダム表示になるようにして」）
  let cur = Math.floor(Math.random() * n);
  const nav = document.createElement('div'); nav.className = 'ringnav';
  nav.innerHTML = '<button type="button" class="rprev" aria-label="前の動画">◀</button><span class="rcount"></span><button type="button" class="rnext" aria-label="次の動画">▶</button>';
  if (n > 1) camps.after(nav);
  // 動画を選ぶ並びはライフの枠の左へ（11-07 佐藤さん「下の3項目縦並びに出来るでしょ、そしたら左が開くと思うからそこに動画選ぶUI一式持っていこう」）
  const pbox = document.getElementById('pbox');
  if (pbox) { const wrap = document.createElement('div'); wrap.className = 'pring'; pbox.appendChild(wrap); wrap.append(camps, nav); }
  const place = () => {
    list.forEach((el, i) => {
      let o = i - cur; if (o > n / 2) o -= n; if (o < -n / 2) o += n; if (n === 2 && o === -1) o = 1;   // 2本の時は右に置く
      const a = Math.abs(o);
      el.style.transform = `translateX(${o * 66}%) translateZ(${-a * 260}px) rotateY(${-o * 34}deg) scale(${1 - Math.min(a, 2) * .06})`;
      el.style.opacity = a === 0 ? 1 : a === 1 ? .32 : 0;
      el.style.zIndex = 10 - a;
      el.style.pointerEvents = a > 1 ? 'none' : '';
      el.classList.toggle('front', a === 0);
    });
    nav.querySelector('.rcount').textContent = `${cur + 1} / ${n}`;
  };
  const go = i => { cur = (i + n) % n; place(); try { gtag('event', 'jd_ring_' + (cur + 1)); } catch (_) {} };
  list.forEach((el, i) => el.addEventListener('click', e => { if (!el.classList.contains('front')) { e.preventDefault(); e.stopPropagation(); go(i); } }, true));
  nav.querySelector('.rprev').onclick = () => go(cur - 1);
  nav.querySelector('.rnext').onclick = () => go(cur + 1);
  let sx = null;
  camps.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  camps.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50 && n > 1) go(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
  const fitH = () => { camps.style.height = Math.max(...list.map(el => el.offsetHeight)) + 'px'; };
  if (window.ResizeObserver) { const ro = new ResizeObserver(fitH); list.forEach(el => ro.observe(el)); }
  addEventListener('resize', fitH);
  place(); fitH();
}

// 編集三箇条を1条ずつ大きくふわっと出す（11-07 佐藤さん「編集3か条もっと大きく出したい」「下にいったら3か条が大きくふわっと出る感じ」）
function setupCreedReveal() {
  // 1画面に収めたので、画面に入ったら題→一→二→三の順に間を置いて出す
  const box = document.getElementById('creed');
  // 三箇条の下に、冒頭と同じ形の誘導（押すとメーターと動画の枠へ）
  const cue = document.createElement('button'); cue.type = 'button'; cue.className = 'ccue'; cue.innerHTML = LS('creedCue', '罰ゲーム状況') + '<b>▼</b>';
  cue.onclick = () => {   // メーターと動画の枠の上端がタブの帯に潜らない所で止める
    const pb = document.getElementById('pbox'), n = (pb && pb.closest('main')) || pb || box.nextElementSibling; if (!n) return;
    const nav = document.querySelector('.stuck'), off = (nav ? nav.getBoundingClientRect().height : 0) + 16;
    window.scrollTo({ top: n.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' });
  };
  box.appendChild(cue);
  const items = [...box.querySelectorAll('.ctitle2, .item, .ccue')];
  items.forEach((e, i) => { e.classList.add('rv'); e.style.transitionDelay = (i * 0.45) + 's'; });
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { items.forEach(e => e.classList.add('in')); io.disconnect(); } }), { threshold: .3 });
  io.observe(box);
}

// 冒頭の全画面（11-07）: 背景に迷いの言葉を何段も流し（段ごとに向きと速さを変える）、中央に宣言を1行ずつ出す。下の「検証のルール」で次へ
function buildHero(hd, h) {
  document.body.classList.add('heromode');
  const sec = document.createElement('section'); sec.id = 'hero';
  const bg = document.createElement('div'); bg.className = 'hbg'; bg.setAttribute('aria-hidden', 'true');
  const ds = hd.doubts || [], rows = 9;
  for (let r = 0; r < rows && ds.length; r++) {
    const row = document.createElement('div'); row.className = 'hrow' + (r % 2 ? ' rev' : '') + (r % 3 === 1 ? ' big' : '');
    const seq = ds.map((_, i) => ds[(i + r * 3) % ds.length]);   // 段ごとに並びをずらす（5ずつだと10個の時に2通りしかできず、同じ言葉が縦に並んだ）
    const sp = document.createElement('span');
    [...seq, ...seq].forEach(t => { const it = document.createElement('i'); it.className = 'hd'; it.textContent = t; sp.appendChild(it); });   // 2周並べて半分動かすと継ぎ目なく回る
    sp.style.animationDuration = (90 + (r * 37) % 60) + 's';
    row.appendChild(sp); bg.appendChild(row);
  }
  const fg = document.createElement('div'); fg.className = 'hfg';
  const lines = (cls, text) => { const d = document.createElement('div'); d.className = cls;
    (text || '').split('|').forEach(t => { const s = document.createElement('span'); s.className = cls === 'hmain' ? 'hm-line' : 'hs-line'; s.textContent = t; d.appendChild(s); }); return d; };
  const m = lines('hmain', hd.main), s = lines('hsub', hd.sub);
  fg.append(m, s);
  [...fg.querySelectorAll('.hm-line, .hs-line')].forEach((e, i) => { e.style.transitionDelay = (0.3 + i * 0.45 + (e.classList.contains('hs-line') ? 0.5 : 0)) + 's'; });
  const cue = document.createElement('button'); cue.type = 'button'; cue.className = 'hcue'; cue.innerHTML = '<span></span><b>▼</b>';
  cue.firstChild.textContent = hd.cue || ''; cue.firstChild.dataset.lbl = 'cue';
  cue.onclick = () => { const n = document.getElementById('creed') || document.getElementById('rules') || document.getElementById('camps'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  sec.append(bg, fg, cue);
  // 冒頭の小さい文（sub）の各行の上の間隔（11-11 佐藤さん「文言の位置調整できるようにして　冒頭のページ」「でも…の文を↑の全作品に～と離したい」）:
  // 最後の行（赤字）は labels.hsubGap、ほかの行は上から数えて labels.hGapS0, hGapS1…（em・行を足し引きすると番号がずれる）。編集モードでは左下の枠の ▲▼ で 0.2 ずつ動かし、数字は決まり文句と同じ口（data-lbl）で保存される
  // 11-11 佐藤さん「文字の大きさも調整できるようにして、位置も改めて調整できるように、さっき移動範囲に制限があった」: 宣言（main）の行も同じ枠に足し（hGapM0…）、
  // 間隔は −10〜30em（前は −1〜8）、大きさは行ごとに labels.hSzM0…／hSzS0…（%・30〜300・既定100）。大きさを変えても間隔は変わらない（margin を大きさで割る）。数字は直接打ってもよい
  { const nOf = (t, d, lo, hi) => { const g = parseFloat(t); return isFinite(g) ? Math.max(lo, Math.min(hi, g)) : d; };
    const gp = document.createElement('div'); gp.className = 'hgap';
    const ml = [...m.querySelectorAll('.hm-line')], sl = [...s.querySelectorAll('.hs-line')];
    const rows = [...ml.map((ln, i) => ({ ln, gk: 'hGapM' + i, sk: 'hSzM' + i, gd: 0 })),
                  ...sl.map((ln, i) => { const last = i === sl.length - 1; return { ln, gk: last ? 'hsubGap' : 'hGapS' + i, sk: 'hSzS' + i, lk: 'hLhS' + i, gd: last ? .2 : 0 }; })];
    // スマホの幅（560px 以下）は別の数字を持つ（11-11 佐藤さん「それは気になる、スマホ用のページ出して」＝パソコンで130%にした行がスマホで宣言より大きく出た）:
    // 同じキーの後ろに _sp。スマホ用の数字が無い間はパソコンの数字のまま出る。スマホの幅で開いた編集モードの枠はスマホ用の数字だけを書く
    const mq = matchMedia('(max-width: 560px)');
    const buildRows = () => { const sp = mq.matches, K = k => sp ? k + '_sp' : k, ld = sp ? 1.5 : 1.9; gp.textContent = ''; gp.dataset.sp = sp ? '1' : '';
     rows.forEach(({ ln, gk, sk, lk, gd }) => {
      const row = document.createElement('div'); row.className = 'hgrow';
      row.innerHTML = '<span class="hgn"></span><span class="hgt">上の間隔</span><button type="button" data-k="g" data-d="-0.2">▲<i> 詰める</i></button><span data-lbl="' + K(gk) + '"></span><button type="button" data-k="g" data-d="0.2">▼<i> 離す</i></button>'
        + '<span class="hgt">大きさ%</span><button type="button" data-k="s" data-d="-5">−<i> 小さく</i></button><span data-lbl="' + K(sk) + '"></span><button type="button" data-k="s" data-d="5">＋<i> 大きく</i></button>'
        // 文ごとの行間（11-11 佐藤さん「大きさ変えれるようにして、あと行間も」「行間をせばめるボタンは？それが１番調整したいんだけど」「それやったら全部の文字が狭まったから使えない」）:
        // labels.hLhS0…／スマホは _sp。その文が折り返した時の行どうしの間だけが変わる（文の位置・ほかの文との間は動かさない＝減らした分を上下の余白で戻す）。文字の何倍か・0.8〜4・0.1刻み・既定 パソコン1.9／スマホ1.5
        + (lk ? '<span class="hgl"><span class="hgt">この文の行間</span><button type="button" data-k="l" data-d="-0.1">−<i> せばめる</i></button><span data-lbl="' + K(lk) + '"></span><button type="button" data-k="l" data-d="0.1">＋<i> ひろげる</i></button></span>' : '');
      row.firstChild.textContent = '「' + ln.textContent.slice(0, sp ? 4 : 7) + '…」';
      const gN = row.querySelector('[data-lbl="' + K(gk) + '"]'), sN = row.querySelector('[data-lbl="' + K(sk) + '"]'), lN = lk ? row.querySelector('[data-lbl="' + K(lk) + '"]') : null;
      const gv = () => nOf(gN.textContent, gd, -10, 30), sv = () => nOf(sN.textContent, 100, 30, 300), lv = () => nOf(lN.textContent, ld, .8, 4);
      const put = () => { const z = sv() / 100, c = lN ? Math.round((ld - lv()) * 50) / 100 : 0;
        if (lN) { ln.style.lineHeight = lv(); ln.style.marginBottom = c + 'em'; }
        ln.style.marginTop = 'calc(' + gv() + 'em / ' + z + ' + ' + c + 'em)'; ln.style.setProperty('--sz', z); };
      const g0 = nOf(L(gk, String(gd)), gd, -10, 30), s0 = nOf(L(sk, '100'), 100, 30, 300);   // パソコンの数字
      gN.textContent = String(sp ? nOf(L(K(gk), String(g0)), g0, -10, 30) : g0); sN.textContent = String(sp ? nOf(L(K(sk), '100'), 100, 30, 300) : s0);   // スマホの大きさはパソコンの数字を引き継がず100%から（11-11 佐藤さん「何で 全作品～ だけこんな大きいの？」→「そうして」。間隔は引き継ぐ）
      if (lN) lN.textContent = String(nOf(L(K(lk), String(ld)), ld, .8, 4));
      put();
      row.querySelectorAll('button').forEach(b => b.onclick = () => { const k = b.dataset.k, d = parseFloat(b.dataset.d), n = k === 'g' ? gN : k === 's' ? sN : lN;
        n.textContent = String(k === 'g' ? nOf(Math.round((gv() + d) * 10) / 10, gd, -10, 30) : k === 's' ? nOf(sv() + d, 100, 30, 300) : nOf(Math.round((lv() + d) * 10) / 10, ld, .8, 4));
        put(); n.dispatchEvent(new Event('input', { bubbles: true })); });
      [gN, sN, lN].forEach(n => n && n.addEventListener('input', put));
      gp.appendChild(row); }); };
    buildRows(); mq.addEventListener('change', () => { buildRows(); fitMain(); });
    sec.appendChild(gp);
    // 宣言（折り返さない行）が窓の幅からはみ出す時は、2行まとめて同じ倍率で縮める（11-11）。大きさを変えた時・窓の幅が変わった時・字体が読み込まれた時に測り直す
    const fitMain = () => { m.style.setProperty('--fit', 1);
      const avail = sec.clientWidth - 32, widest = Math.max(1, ...ml.map(l => { const r = document.createRange(); r.selectNodeContents(l); return r.getBoundingClientRect().width; }));
      m.style.setProperty('--fit', Math.min(1, avail / widest * .98).toFixed(4)); };
    fitMain(); addEventListener('resize', fitMain); gp.addEventListener('input', fitMain); gp.addEventListener('click', () => setTimeout(fitMain, 0));
    document.fonts.ready.then(fitMain).catch(() => {}); }
  // 後ろに流す完成動画（11-11）: bgVideos は {src, by（配信者）}。同じ配信者は1回の表示で1本まで・出る配信者／その人のどの動画か／並びは開くたびにランダム
  //（佐藤さん「同じ配信者の動画が２つ以上でるのは良くないから１人１個までにして、あと出る動画はランダムにしてほしい」）。縦型を画面の幅に入る本数だけ横に並べる（スマホは1本）。無音・繰り返し・画面の外では止める
  const bv = (hd.bgVideos || []).map(x => typeof x === 'string' ? { src: x, by: x } : x).filter(x => x && x.src);
  if (bv.length) {
    const hv = document.createElement('div'); hv.className = 'hvid'; hv.setAttribute('aria-hidden', 'true');
    const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    // 11-11 佐藤さん「毎回クリシアさんの後編とねこさんのアリスのやつは出すようにして、あと１個は男性のをランダムに、ただし配置は毎回変わるようにして！」:
    // always: true は毎回出す／pool: true は残りの枠にランダムで1本ずつ（出ている配信者とは重ねない）／どちらも無い物は出さない。印が1つも無い設定は前のまま（1人1本で全部からランダム）
    const n = Math.max(1, Math.round(innerWidth / (innerHeight * 9 / 16))), marked = bv.some(x => x.always || x.pool);
    let pick = bv.filter(x => x.always);
    const used = new Set(pick.map(x => x.by || x.src));
    shuf(bv.filter(x => marked ? x.pool : true)).forEach(x => { const k = x.by || x.src; if (pick.length < Math.max(3, n) && !used.has(k)) { used.add(k); pick.push(x); } });
    // 枠が足りない幅（スマホの縦持ちは1本）では、毎回出す物（always）を先に選ぶ（11-11 佐藤さん「パソコンで必ず出すとしてるやつの中からランダムで１個出して」）。並びはその後で混ぜる
    shuf([...shuf(pick.filter(x => x.always)), ...shuf(pick.filter(x => !x.always))].slice(0, n)).forEach(x => { const v = document.createElement('video');
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.preload = 'auto'; v.disablePictureInPicture = true; v.tabIndex = -1;
      v.src = x.src; hv.appendChild(v); });
    sec.insertBefore(hv, bg);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    new IntersectionObserver(es => es.forEach(x => hv.querySelectorAll('video').forEach(v => { if (x.isIntersecting && !still) v.play().catch(() => {}); else v.pause(); })), { threshold: 0 }).observe(sec);
  }
  document.querySelector('main').before(sec);   // main の余白の外に置き、画面いっぱいにする
  new IntersectionObserver(es => es.forEach(x => document.body.classList.toggle('heroview', x.intersectionRatio > .35)), { threshold: [0, .35, 1] }).observe(sec);
  requestAnimationFrame(() => requestAnimationFrame(() => sec.classList.add('on')));
}

// どこまで見て・どこで離れ・YouTube へ飛んだかを数える（11-01 佐藤さん「どこで離脱したのか、ちゃんとYouTubeに飛んで離脱してるのか」）。
// 中身はイベント名に入れる（GA の「イベント」レポートで設定なしに並ぶ）。gtag は公開アドレスでしか読まれないので手元では送られない。
//   jd_see_<場所>   その場所が画面に入った（top・c1・c2＝各企画のサムネ・gauge＝再生数の枠・steps＝STEPカード・punish・records）
//   jd_yt_main_c1 / jd_sub_c1 / jd_yt_punish / jd_yt_record / jd_portfolio / jd_rule  押した物
//   jd_alive_10s / 30s / 60s / 180s  開いたまま見ていた時間（画面が裏に回っている間は数えない）
//   jd_leave_at_<一番奥まで見た場所> / jd_leave_after_yt  離れた時（ページを閉じた・アプリへ移った）
function setupTrack() {
  const send = (name, p = {}) => { try { gtag('event', name, Object.assign({ transport_type: 'beacon' }, p)); } catch (_) {} };
  const order = ['top', 'creed', 'c1', 'c2', 'c3', 'kodawari', 'gauge', 'steps', 'punish', 'records'], seen = new Set();
  // どの投稿から来たか（11-05 佐藤さん「アクセス率に差が出るかも見てみたい」）: X の投稿ごとに ?from=know（ノウハウ）／?from=punish（罰ゲーム）等を付けて貼る → GA に jd_from_<名前>
  const from = (new URLSearchParams(location.search).get('from') || '').replace(/[^\w-]/g, '').slice(0, 20);
  if (from) send('jd_from_' + from);
  let deepest = 'top', clickedYt = false, left = false, visMs = 0, visFrom = document.hidden ? 0 : Date.now();
  const mark = z => { if (seen.has(z)) return; seen.add(z); send('jd_see_' + z); if (order.indexOf(z) > order.indexOf(deepest)) deepest = z; };
  mark('top');
  const zones = [];
  cfg.campaigns.forEach((c, i) => {
    zones.push([c.el.querySelector('.thumb'), 'c' + (i + 1)], [c.el.querySelector('.cbox'), 'gauge'], [c.el.querySelector('.mcards'), 'steps']);
    c.el.querySelector('.thumb').dataset.trk = 'jd_yt_main_c' + (i + 1);
    c.el.querySelector('.sub').dataset.trk = 'jd_sub_c' + (i + 1);
    const kd = c.el.querySelector('.kodawari');   // こだわりの欄（見た・そこから YouTube へ飛んだ）
    if (kd) { zones.push([kd, 'kodawari']); kd.querySelectorAll('a').forEach(a => { a.dataset.trk = 'jd_yt_kodawari_c' + (i + 1); }); }
  });
  zones.push([document.getElementById('punishBox'), 'punish'], [document.getElementById('recordBox'), 'records']);
  // 11-23 TOP を3つの掟（#s2）へ替えて旧 #creed を隠したので、同じ名前 'creed' で #s2 を数える
  const cr = document.getElementById('s2') || document.getElementById('creed'); if (cr) zones.push([cr, 'creed']);
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { mark(x.target.dataset.zone); io.unobserve(x.target); } }), { threshold: .5 });
  zones.forEach(([el, z]) => { if (el && !el.hidden) { el.dataset.zone = z; io.observe(el); } });
  document.addEventListener('click', e => {
    if (e.target.closest('#ruleBtn')) { send('jd_rule'); return; }
    const a = e.target.closest('a'); if (!a) return;
    let n = a.dataset.trk;
    if (!n) n = a.closest('#punishBox') ? 'jd_yt_punish' : a.closest('#records') ? 'jd_yt_record' : a.id === 'pflink' ? 'jd_portfolio' : 'jd_link_other';
    if (/^jd_(yt|sub)/.test(n)) clickedYt = true;
    lastLink = { kind: /^jd_yt_(main|kodawari|record)/.test(n) ? 'clip' : n === 'jd_yt_punish' ? 'punish' : /^jd_sub/.test(n) ? 'sub' : n === 'jd_portfolio' ? 'portfolio' : 'other', t: Date.now() };
    send(n, { seconds: Math.round(watched() / 1000) });
  }, true);
  const watched = () => visMs + (visFrom ? Date.now() - visFrom : 0);
  const alive = [10, 30, 60, 180];
  const tick = setInterval(() => {
    while (alive.length && watched() >= alive[0] * 1000) send('jd_alive_' + alive.shift() + 's');
    if (!alive.length) clearInterval(tick);
  }, 1000);
  const leave = () => {
    if (left) return; left = true;
    send(clickedYt ? 'jd_leave_after_yt' : 'jd_leave_at_' + deepest, { seconds: Math.round(watched() / 1000) });
  };
  // 11-23 抜け方（佐藤さん「ページ内のリンクを押して外部に飛んだのかブラウザバックしたのかの違いもわかるようにして」）。1回離れるごとに1つ送る:
  //   jd_exit_link_<clip|punish|sub|portfolio|other>  リンクを押して5秒以内に画面を離れた（clip＝切り抜き動画）
  //   jd_exit_back_<一番奥の場所>   ブラウザの「戻る」（前のページがあり、画面を一度触った後だけ見分けられる）
  //   jd_exit_close_<一番奥の場所>  閉じた・別のアドレスへ移った（触る前の「戻る」もここに入る）
  //   jd_exit_hide_<一番奥の場所>   アプリ・タブを切り替えて離れた（その後閉じたかは分からない）
  let lastLink = null, exitSent = false, hideTimer = 0;
  const exitP = () => ({ seconds: Math.round(watched() / 1000) });
  const exitSend = (how) => {
    if (exitSent) return; exitSent = true; clearTimeout(hideTimer);
    if (lastLink && Date.now() - lastLink.t < 5000) send('jd_exit_link_' + lastLink.kind, exitP());
    else send('jd_exit_' + how + '_' + deepest, exitP());
  };
  if (history.length > 1) {
    const arm = () => {
      removeEventListener('pointerdown', arm, true); removeEventListener('keydown', arm, true);
      try { history.pushState({ jdTrap: 1 }, '', location.href); } catch (_) {}
    };
    addEventListener('pointerdown', arm, true); addEventListener('keydown', arm, true);
    addEventListener('popstate', (e) => {
      if (e.state && e.state.jdTrap) return;
      exitSend('back'); leave(); setTimeout(() => history.back(), 150);
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (visFrom) { visMs += Date.now() - visFrom; visFrom = 0; } leave();
      // リンクで離れたならすぐ送る。それ以外は閉じる（pagehide）が続くかを少し待ち、来なければ「切り替えて離れた」
      if (lastLink && Date.now() - lastLink.t < 5000) exitSend('link');
      else { clearTimeout(hideTimer); hideTimer = setTimeout(() => exitSend('hide'), 400); }
    } else { visFrom = Date.now(); left = false; clickedYt = false; exitSent = false; lastLink = null; clearTimeout(hideTimer); }   // 戻ってきたらもう一度離れた時を数える
  });
  addEventListener('pagehide', () => { leave(); exitSend('close'); });
}

<script id="s23js">
(function(){let n=0;const t=setInterval(()=>{const pb=document.getElementById('pbox'),s2=document.getElementById('s2');
  if(!pb||!pb.querySelector('.pring')||!s2){if(++n>100)clearInterval(t);return}clearInterval(t);
  const life=document.createElement('div');life.className='s2life';const info=document.createElement('div');info.className='s2info';
  ['.plabel','#pnum','#pghost','.pcards','.settle','#pbanner'].forEach(q=>{const e=pb.querySelector(q);if(e)info.appendChild(e)});
  life.append(info,pb.querySelector('#pmeter'));s2.appendChild(life);pb.classList.add('ringonly');
  {const w=document.createElement('div');w.className='s2clip';s2.before(w);w.appendChild(s2);
   const nx=document.createElement('div');nx.className='s2next';nx.textContent='現在の審判の状況 ▼';
   // 11-24 配置エディタのライフの部品（S2 の k:'life'）: パソコンは部品ごとに置いた位置・幅で、スマホは今までの並び
   const LP=(typeof S2!=='undefined'?S2.els:[]).filter(d=>d.k==='life'&&d.on!==false);
   const Q={plabel:'.plabel',pnum:'#pnum',pghost:'#pghost',pstock:'.pcards .pc:not(.ult):not(#outCard)',pult:'.pcards .pc.ult',settle:'.settle',pmeter:'#pmeter'};
   const W={plabel:118,pnum:316,pghost:316,pstock:316,pult:316,settle:316,pmeter:200};
   const home=[];LP.forEach(d=>{const e=life.querySelector(Q[d.id]);if(e)home.push({d,e,par:e.parentNode,nxt:e.nextSibling})});
   const wraps=home.map(h=>{const b=document.createElement('div');b.className='s2info lp';b.dataset.lp=h.d.id;b.style.cssText=`position:absolute;z-index:2;left:${h.d.x/12.8}cqw;top:${(h.d.y-58)/12.8}cqw;width:${W[h.d.id]}px;transform-origin:50% 0;font-family:"Noto Serif JP",serif;color:#fff;text-align:center`;return b});
   const fitLp=()=>{const k=s2.clientWidth/1280;home.forEach((h,i)=>wraps[i].style.transform=`translateX(-50%) scale(${h.d.s/W[h.d.id]*k})`)};
   const place=()=>{if(mq.matches){home.slice().reverse().forEach(h=>h.par.insertBefore(h.e,h.nxt&&h.nxt.parentNode===h.par?h.nxt:null));wraps.forEach(b=>b.remove());life.classList.add('mob');life.style.display='';w.after(life);life.after(nx)}
     else{life.classList.remove('mob');s2.appendChild(life);nx.remove();if(home.length){home.forEach((h,i)=>{wraps[i].appendChild(h.e);s2.appendChild(wraps[i])});life.style.display='none';fitLp()}}};
   const mq=matchMedia('(max-width:760px)');addEventListener('resize',()=>{if(!mq.matches&&home.length)fitLp()});
   place();mq.addEventListener('change',place)}
  {const c=document.createElement('div');c.id='s3catch';c.className='s3c';const b=document.createElement('div');b.className='s3b';c.appendChild(b);pb.after(c);if(typeof S3!=='undefined'){build(b,S3);const m=document.createElement('div');m.className='s3m';const t=(S3.els.find(e=>e.id==='catch')||{}).t||'';m.innerHTML=t.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])).replace(/、/g,'、<br>').replace(/\n/g,'<span class="s3gap"></span>').replace(/ので/g,'ので<br>');c.appendChild(m)}}
  // 11-24 配置エディタの3画面目のカードの塊（S3 の cards）: 横の位置・上の位置・幅。カードの下の帯も一緒にずれる（パソコンだけ）
  {const cd=(typeof S3!=='undefined'?S3.els:[]).find(d=>d.id==='cards'&&d.k==='life');if(cd){const mq2=matchMedia('(max-width:760px)');
    const mt0=parseFloat(getComputedStyle(pb).marginTop)||0;const put=()=>{if(mq2.matches){pb.style.zoom='';pb.style.boxSizing='';pb.style.width='';pb.style.maxWidth='';pb.style.position='';pb.style.left='';pb.style.marginTop='';return}const z=cd.s/1200;
      pb.style.zoom=z===1?'':String(z);pb.style.boxSizing=z===1?'':'border-box';pb.style.width=z===1?'':'1200px';pb.style.maxWidth=z===1?'':'none';pb.style.position='relative';pb.style.left=((cd.x-640)/z)+'px';pb.style.marginTop=(cd.y===58&&z===1)?'':((mt0+cd.y-58)/z)+'px'};
    put();mq2.addEventListener('change',put)}}
  pb.querySelectorAll('.camp').forEach(c=>{const r=document.createElement('div');r.className='cright';['.cbox','a.sub','.kdbtn'].forEach(q=>{const e=c.querySelector(':scope > '+q);if(e)r.appendChild(e)});c.appendChild(r)});
  // 11-24 配置エディタで文字1つずつ直した所（const EP・apply_editor_layout.py all が書く）。数字が描き直されても残るよう1秒おきに当て直す
  if(typeof EP!=='undefined'){const QS={plabel:'.plabel',pnum:'#pnum',pghost:'#pghost',pstock:'.pcards .pc:not(.ult):not(#outCard)',pult:'.pcards .pc.ult',settle:'.settle',pmeter:'#pmeter'};
   const S=(n,k,v)=>{if(n.style.getPropertyValue(k)!==v||n.style.getPropertyPriority(k)!=='important')n.style.setProperty(k,v,'important')};
   const walk=(root,path)=>{let n=root;for(const i of path||[]){n=n&&[...n.children].filter(c=>getComputedStyle(c).display!=='none')[i]}return n};  // エディタの写しは隠れた要素を持たないので、見えている子だけ数える
   const find=(root,o)=>o.sel?(root.matches(o.sel)?root:root.querySelector(o.sel)):(o.path?walk(root,o.path):null);
   const put=(n,o)=>{const P=o.P||{};
     if(P.c){if(o.box)S(n,'background',P.c);else{S(n,'color',P.c);S(n,'-webkit-text-fill-color',P.c)}}
     if(P.b)S(n,'font-weight',String(P.b));if(P.ta)S(n,'text-align',P.ta);if(P.ff)S(n,'font-family',P.ff);if(P.ls!=null)S(n,'letter-spacing',P.ls+'em');if(P.lh)S(n,'line-height',String(P.lh));
     if(P.nw||P.bw){['height','max-height','max-width'].forEach(k=>S(n,k,k==='height'?'auto':'none'));S(n,'overflow','visible');S(n,'-webkit-line-clamp','unset')}
     if(P.nw){S(n,'white-space','nowrap');S(n,'width','max-content')}if(P.bw){S(n,'width',P.bw+'px');S(n,'white-space','normal')}
     if(P.dx||P.dy||(P.z&&P.z!==1)){if(getComputedStyle(n).display==='inline')S(n,'display','inline-block');S(n,'translate',(P.dx||0)+'px '+(P.dy||0)+'px');S(n,'scale',String(P.z||1))}
     if(P.h)S(n,'visibility','hidden');if(P.t!=null&&!n.dataset.lbl&&n.textContent!==P.t)n.textContent=P.t};
   const epApply=()=>{for(const id in EP){const o=EP[id];
     if(id==='cards')document.querySelectorAll('#pbox section.camp').forEach(sec=>{for(const r in o.R){const n=find(sec,o.R[r]);if(n)put(n,o.R[r])}
       for(const k in (o.T||{})){const t=o.T[k];if(t.vid!==sec.dataset.vid)continue;const n=walk(sec,t.path);if(n&&n.textContent!==t.t)n.textContent=t.t}});
     else document.querySelectorAll('.s2info '+QS[id]).forEach(root=>{for(const r in o.R){const n=find(root,o.R[r]);if(n)put(n,o.R[r])}})}};
   epApply();setInterval(epApply,1000)}
  dispatchEvent(new Event('resize'))},100)})();
</script>
