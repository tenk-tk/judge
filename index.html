  .pop { font-family: 'Mochiy Pop One', 'M PLUS Rounded 1c', sans-serif; font-weight: 400; }

  #cheer { position: relative; z-index: 2; display: inline-block; max-width: 92%; box-sizing: border-box; margin: 30px auto -6px;

  #cheer[hidden], #pace[hidden] { display: none; }   /* 上の display 指定が hidden に勝って空の吹き出しが出たので明示する */

  /* 節目を超えてから次の節目までは、再生数の枠をお祝いの見た目にする */

  /* ===== 再生数のゲージ（事前登録の達成報酬・キャンディクラッシュのスターメーター風。10-31 佐藤さん「ポップに」） =====
     ゲージが伸びて、節目（目標÷4ずつ）の星に届くと、星が弾んで色が付き「○回 達成！」の吹き出しが出る。
     下に節目のカードを並べ、届いた所に「達成」の判子を押す（事前登録サイトの「達成済み」と同じ見せ方） */
  .meter { position: relative; margin: 52px 26px 6px; }
  .mtrack { height: 24px; border-radius: 999px; background: #2b2540; border: 3px solid #3b1c00;

  @keyframes stripes { to { background-position: 22.6px 0, 0 0; } }
  .mstar { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
           display: flex; align-items: center; justify-content: center; border: 3px solid #3b1c00;
           background: #5c5675; box-shadow: 0 3px 0 #3b1c00; font-size: 22px; color: #8d88a3; line-height: 1; }
  .mstar .lock { position: absolute; right: -6px; bottom: -6px; font-size: 14px; }
  .mstar .val { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); white-space: nowrap;
                font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 11px; color: #aaa; }
  .mstar.done { background: radial-gradient(circle at 35% 30%, #fff6a8, #ffc400 60%, #ff9d00); color: #fff;

  .mstar.done .lock { display: none; }
  .mstar.done .val { color: #ffe14d; }

  @keyframes starpop { 0% { transform: scale(.4) rotate(-40deg); } 60% { transform: scale(1.5) rotate(10deg); } 100% { transform: none; } }

  .mbubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);

  .mstar.last .mbubble.on { transform: scale(1); }
  .mstar.last .mbubble::after { left: auto; right: 22px; transform: none; }

  .mcard .st { font-size: 11px; letter-spacing: .05em; }

  /* このままだと食べる虫の数（節目を超えるごとに1匹減る） */
  .bugs { margin: 18px auto 0; padding: 12px 10px 10px; max-width: 360px; border: 3px solid #3b1c00; border-radius: 18px;

  .bugs-label { font-size: 13px; color: #c2185b; }
  .bugs-row { display: flex; justify-content: center; gap: 4px; margin: 8px 0 4px; }
  /* 虫の絵は佐藤さんの素材（かいねこ\2_素材\05_画像\mushi_imomushi.png を縮めて img_imomushi.png に置いた・11-01） */
  .bug { position: relative; width: 70px; height: 46px; display: flex; align-items: center; justify-content: center; }
  .bug img { width: 100%; height: 100%; object-fit: contain; }
  .bug.gone img { filter: grayscale(1); opacity: .35; }
  .bug.gone::after { content: ""; position: absolute; left: 50%; top: 50%; width: 90%; height: 4px; border-radius: 2px; background: #e8213f;
                     transform: translate(-50%, -50%) rotate(-35deg); }
  .bug .off { display: none; position: absolute; right: -10px; top: -10px; padding: 1px 5px; border-radius: 999px; background: #e8213f; color: #fff;
              font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 11px; border: 2px solid #fff; filter: none; }
  .bug.gone .off { display: block; }

  .bar > div { height: 100%; width: 0; background: #ffd400; transition: width .8s; }

  /* ===== ポイント制（config の points があれば出す・11-07 テストページで試す。見た目は points/ の見本と同じ） ===== */

<body>
<nav class="topnav"><a id="pflink" href="https://tenk-tk.github.io/portfolio/" rel="noopener"><span data-lbl="req">切り抜き依頼はこちら</span></a><span class="stop" data-lbl="reqStop">※現在受注停止中</span></nav>
<main class="wide">
  <h1 id="headline" class="fade"></h1>
  <div class="swipehint">← 横にスワイプして ほかの企画も見られます →</div>
  <div class="camps" id="camps"></div>
  <div class="dots" id="dots"></div>
  <div class="extras">
  <div class="box fade" id="punishBox" hidden>
    <div class="label">罰ゲームの様子はこちら</div>
    <ul id="punishList"><li>
      <a class="rthumb" id="punishWatch" rel="noopener"><img id="punishThumb" alt=""></a>
      <div class="rbody"><a class="rtitle" id="punishTitle" rel="noopener"></a></div>
    </li></ul>
  </div>

  <div class="box fade" id="recordBox" hidden>
    <div class="label">これまでの戦績</div>
    <ul id="records"></ul>
  </div>
  </div>
</main>
<button id="ruleBtn" type="button">ルール詳細<span class="arrow">▼</span></button>
<script>
// 行ごとに折り返さない見出しが、画面の幅に収まるよう文字を縮める（本番と同じ）
function fitLines(box) {
  box.style.fontSize = '';
  const max = box.clientWidth, lines = [...box.querySelectorAll('.line:not(.note)')];   // 「※」の小さい行は幅に数えず折り返す（11-05 長い注記で見出しまで小さくなった）
  const widest = Math.max(...lines.map(l => { l.style.display = 'inline-block'; const w = l.getBoundingClientRect().width; l.style.display = ''; return w; }));
  const grow = cfg && cfg.creed ? 1.7 : 1;   // 三箇条を出す版は見出しを幅いっぱいまで大きくする（本番の形は今のまま）
  if (widest > max || grow > 1) box.style.fontSize = (parseFloat(getComputedStyle(box).fontSize) * Math.min(grow, max / widest) * 0.98) + 'px';
  // 「※」の行は1行ずつ幅に収める（折り返して1字だけ残るのを防ぐ）
  box.querySelectorAll('.line.note').forEach(l => { l.style.fontSize = ''; l.style.display = 'inline-block'; const w = l.getBoundingClientRect().width; l.style.display = '';
    if (w > max) l.style.fontSize = (parseFloat(getComputedStyle(l).fontSize) * max / w * 0.98) + 'px'; });
}
// ふわっと出す＋右下の「ルール詳細」（本番と同じ）。ボタンは再生数の枠がどれか見えたら消す。押すと今見ている企画の再生数の枠へ移る
function setupFade() {
  const btn = document.getElementById('ruleBtn'), boxes = [...document.querySelectorAll('.camp .cbox')];
  document.querySelectorAll('.camp').forEach(el => el.classList.add('fade'));
  let btnDone = false;
  const hideBtn = () => { if (btnDone) return; btnDone = true; btn.classList.remove('on'); btn.classList.add('gone'); };
  const io = new IntersectionObserver(es => es.forEach(x => {
    if (!x.isIntersecting) return;
    if (x.target.classList.contains('cbox')) { hideBtn(); io.unobserve(x.target); return; }
    x.target.classList.add('show'); io.unobserve(x.target);
  }), { threshold: .15 });
  document.querySelectorAll('.fade').forEach(el => io.observe(el));
  boxes.forEach(b => io.observe(b));
  btn.onclick = () => {
    hideBtn();
    const camps = document.getElementById('camps'), mid = camps.getBoundingClientRect().left + camps.clientWidth / 2;
    const b = boxes.reduce((a, x) => Math.abs(x.getBoundingClientRect().left + x.offsetWidth / 2 - mid) < Math.abs(a.getBoundingClientRect().left + a.offsetWidth / 2 - mid) ? x : a);
    b.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'nearest' });
  };
  setTimeout(() => { if (!btnDone) btn.classList.add('on'); }, 1400);
}
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
let cfg;
// 罰ゲームの種類（企画ごとに config の punish で選ぶ。無ければ虫・11-02 百味ビーンズを追加。絵はデスクトップの 百味ビーンズ.png を切り抜いた img_beans.png）
const PUNISH = {
  bug:   { img: 'img_imomushi.png', name: '虫', unit: '匹' },
  beans: { img: 'img_beans.png',    name: '百味ビーンズ', unit: '粒', note: '達成しなければ<b>激マズ味1粒</b>確定' },
};

function setThumb(a, img, id, url) {
  a.href = url || 'https://www.youtube.com/shorts/' + id;
  if (!touch) a.target = '_blank';
  // ショートの縦長サムネ → 無ければ普通のサムネ。予約投稿の前に開いた端末には YouTube の灰色の仮の絵（120×90）が
  // 残ることがあるので、仮の絵が来た時は時刻を付けて取り直す（10-31 罰ゲームの動画で19時の公開後も替わらなかった）
  const urls = ['oardefault', 'hqdefault'].map(n => 'https://i.ytimg.com/vi/' + id + '/' + n + '.jpg');
  let i = 0, retried = false;
  const next = () => {
    if (i < urls.length) { img.src = urls[i++]; return; }
    if (!retried) { retried = true; i = 0; const t = '?t=' + Math.floor(Date.now() / 600000); urls.forEach((u, k) => urls[k] = u + t); next(); }
  };
  img.onerror = next;
  img.onload = () => { if (img.naturalWidth <= 120) next(); };
  next();
}

function ytId(u) { const m = (u || '').match(/(?:shorts\/|v=|youtu\.be\/|embed\/)([\w-]{11})/); return m && m[1]; }

function renderExtras() {
  const pid = ytId(cfg.punishVideoUrl);
  if (pid) {
    const pw = document.getElementById('punishWatch'), pt = document.getElementById('punishTitle');
    setThumb(pw, document.getElementById('punishThumb'), pid, cfg.punishVideoUrl);
    pt.href = pw.href; pt.target = pw.target; pt.textContent = cfg.punishVideoTitle || 'YouTube で見る';
    document.getElementById('punishBox').hidden = false;
  }
  // 締め切りを過ぎた企画は上の並びから外し、戦績へ足す（11-05 佐藤さん「集計終わったやつは随時画面から消していくようにして」）
  let no = Math.max(0, ...(cfg.records || []).map(r => r.no));
  const auto = (cfg.ended || []).map(c => {
    const P = PUNISH[c.punish] || PUNISH.bug, v = c.finalViews || 0;
    // 罰ゲームの数は、その回に実際に決まった目標（punishTarget＝新しい基準へ替える前の目標）で数える（11-09 目標を新基準へ替えたら食べた数の表示まで変わったため）
    const left = (cfg.milestones || [0.25, 0.5, 0.75, 1]).filter(f => v < Math.round((c.punishTarget || c.target) * f)).length;
    return { no: ++no, title: c.videoTitle, url: 'https://www.youtube.com/shorts/' + c.videoId, views: v, target: c.target, punish: `${P.name}${left}${P.unit}を完食` };
  });
  const recs = (cfg.records || []).concat(auto).sort((a, b) => b.no - a.no);
  if (!recs.length) return;
  const ul = document.getElementById('records');
  recs.forEach(r => {
    const li = document.createElement('li'), win = r.views >= r.target;
    li.dataset.no = r.no;
    // 小さいサムネ（押すと本編と同じく YouTube へ。スマホはアプリ）
    const id = ytId(r.url);
    const th = document.createElement('a'); th.className = 'rthumb'; th.rel = 'noopener';
    const im = document.createElement('img'); im.alt = ''; th.appendChild(im);
    if (id) setThumb(th, im, id, r.url);
    const a = document.createElement('a'); a.href = th.href || r.url; a.target = th.target; a.rel = 'noopener';
    a.textContent = r.title; a.className = 'rtitle';
    const res = document.createElement('span'); res.className = win ? 'win' : 'lose';
    if (win) res.textContent = '回避';
    else { const pu = document.createElement('span'); pu.className = 'punish'; pu.textContent = r.punish; res.append('罰ゲーム（', pu, '）'); }
    const num = document.createElement('div'); num.className = 'rnum';
    num.innerHTML = `<b>${fmt(r.views)}</b> / ${fmt(r.target)} 回`;
    const body = document.createElement('div'); body.className = 'rbody';
    body.append(`第${r.no}回`, document.createElement('br'), a, num, res);
    li.append(th, body);
    ul.appendChild(li);

  gb.style.left = pct(Math.min(pts, aft)) + '%'; gb.style.width = Math.abs(pct(aft) - pct(pts)) + '%';
  gb.style.setProperty('--gpos', pct(Math.min(pts, aft)) + '%'); gb.style.setProperty('--glen', Math.abs(pct(aft) - pct(pts)) + '%');
  // 後ろの数字も点線で消せる（11-09 佐藤さん「まだ消せないんだけど」＝説明文に打ち替えた後ろに −4,288 が残った）。数字の欄を空で保存したら数字を出さない
  const numOff = L('pGhostNum', null) === '';
  const ghostNum = numOff ? '' : ` <b class="${g > 0 ? 'up' : ''}" data-lbl="pGhostNum">${sfmt(g)}</b>`;
  $('pghost').innerHTML = live.length && g && !Loff('pGhost') ? `${LS('pGhost', '集計中の企画がこのまま終わると ライフ')}${ghostNum}` : '';
  document.querySelectorAll('.ptick').forEach(t => t.classList.toggle('got', +t.dataset.p >= P.startPoints - r.crossed * P.stockEvery));
  document.querySelectorAll('.out').forEach((d, i) => { d.classList.toggle('on', i < r.outs); d.classList.toggle('now', i < r.outs && i >= ptPrevOuts); });
  ptPrevOuts = r.outs;
  if ($('outCard')) { $('outsCount').textContent = r.outs + 'アウト';
  $('outCard').classList.toggle('two', r.outs === P.outsFor - 1);
  $('outNote').innerHTML = r.outs === P.outsFor - 1 ? `次も届かなければ ライフ <b>−${fmt(P.outPenalty)}</b>` : `${P.outsFor}アウトで ライフ <b>−${fmt(P.outPenalty)}</b>`; }
  const st = $('stocks'); st.innerHTML = '';
  if (r.stocks) for (let i = 0; i < r.stocks; i++) { const w = document.createElement('div'); w.className = 'wheel'; st.appendChild(w); }
  else st.innerHTML = '<span class="none rd">' + LS('stockNone', 'まだありません') + '</span>';
  $('stockCount').innerHTML = r.stocks + LS('stockUnit', '個');
  const nextLine = P.startPoints - (r.crossed + 1) * P.stockEvery;
  $('stockNote').innerHTML = nextLine > 0 ? (Loff('stockNext') ? '' : `${LS('stockNext', '次のストックまで ライフ残り')} <b>${fmt(pts - nextLine)}</b>`) : LS('stockLast', '次は最強罰ゲーム');
  const box = $('pbox');
  box.classList.toggle('danger', pts <= 0); box.classList.toggle('reward', pts >= max);
  $('pbanner').textContent = pts <= 0 ? '最強罰ゲーム確定' : pts >= max ? `${P.rewardName}確定！` : '';
}
function ptMonthEnd() { const j = new Date(Date.now() + 9 * 3600e3); return Date.UTC(j.getUTCFullYear(), j.getUTCMonth() + 1, 0, 14, 59, 0); }   // 月末 23:59（日本時間）
function paintPt(c, v) {
  const d = v - c.target, el = c.el;
  el.querySelector('.v').textContent = fmt(v);
  el.querySelector('.cbar div').style.width = Math.min(100, v / c.target * 100) + '%';
  const p = el.querySelector('.cpt'); p.classList.toggle('up', d >= 0);
  const lead = c.sample && new Date(c.deadline) <= Date.now() ? LS('cLeadEnd', '集計終了時点で ライフ') : LS('cLead', 'このままだと ライフ');
  const leadOff = Loff(c.sample && new Date(c.deadline) <= Date.now() ? 'cLeadEnd' : 'cLead'), leftOff = Loff('cLeft1') && Loff('cLeft2');
  const l1 = leadOff ? '' : `${lead} <b>${sfmt(d)}</b>`, l2 = d >= 0 || leftOff ? '' : `${LS('cLeft1', 'あと')} ${fmt(-d)} ${LS('cLeft2', '回再生で ±0')}`;
  // 上の行と下の行を別の部品にする（それぞれ枠ごと消せる・11-09）
  p.innerHTML = [l1 && `<span class="cpt1">${l1}</span>`, l2 && `<span class="cpt2">${l2}</span>`].filter(Boolean).join(''); p.style.display = l1 || l2 ? '' : 'none';
}

function paint(c, v) {
  if (cfg.points) return paintPt(c, v);
  const el = c.el, list = c.list;
  el.querySelector('.v').textContent = fmt(v);
  el.querySelector('.cleft').textContent = v >= c.target ? '目標突破！' : `あと ${fmt(c.target - v)} 回`;
  el.querySelector('.mfill').style.width = Math.min(100, v / c.target * 100) + '%';
  el.querySelector('.meter').classList.toggle('max', v >= c.target);
  const stars = el.querySelectorAll('.mstar'), cs = el.querySelector('.mcards').children, bugs = el.querySelector('.bugs-row').children;
  const done = list.filter(m => v >= m).length, left = list.length - done;
  list.forEach((m, i) => {
    stars[i].classList.toggle('done', v >= m);
    cs[i].classList.toggle('done', v >= m);
    cs[i].querySelector('.rest').textContent = v >= m ? '' : `あと${fmt(m - v)}回`;
    bugs[i].classList.toggle('gone', i < done);
  });
  el.querySelector('.bugs').classList.toggle('zero', left === 0);
  el.querySelector('.bugs-count').innerHTML = left > 0 ? `<b>${left}</b> ${c.P.unit}` : `<b>0</b> ${c.P.unit}！ 食べなくていい！`;
  const nx = list.find(m => m > v);
  el.querySelector('.next').innerHTML = nx ? `次の${c.P.name}軽減まで あと <b>${fmt(nx - v)}</b> 回` : `<b>${c.P.name}ゼロ達成！</b> ほんとにありがとう！`;
}

function tickAll() {
  if (cfg.points) { const sc = document.getElementById('settleCd'), ms = ptMonthEnd() - Date.now(), s = Math.floor(ms / 1000);
    if (sc) sc.textContent = (Math.floor(s / 86400) ? Math.floor(s / 86400) + '日 ' : '') + [s % 86400 / 3600, s % 3600 / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':'); }
  cfg.campaigns.forEach(c => {
    const ms = new Date(c.deadline) - Date.now(), b = c.el.querySelector('.cd b');
    if (ms <= 0 && c.sample) { b.textContent = '集計終了（見本）'; return; }   // 見本は締め切り後も並べておく（読み直さない）
    if (ms <= 0) { b.textContent = '集計終了'; if (!tickAll.reloading) { tickAll.reloading = true; setTimeout(() => location.reload(), 3000); } return; }   // 開いたまま締め切りを迎えたら読み直して並びから外す
    const s = Math.floor(ms / 1000), d = Math.floor(s / 86400);
    b.textContent = (d ? d + '日 ' : '') + [s % 86400 / 3600, s % 3600 / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':');
  });
}

async function pollAll() {
  for (const c of cfg.campaigns) {
    let v = c.testViews || 0;
    if (c.viewsFrom) { try { v = (await (await fetch(c.viewsFrom + '?t=' + Date.now(), { cache: 'no-store' })).json()).views; } catch (_) {} }
    c.v = v;
    paint(c, v);
  }
  if (cfg.points) ptPaint();
}

// スマホのスワイプ: 下の点と今見ている企画を揃える
function setupDots() {
  const camps = document.getElementById('camps'), dots = document.getElementById('dots');
  cfg.campaigns.forEach((c, i) => {
    const b = document.createElement('button'); b.setAttribute('aria-label', `企画 ${i + 1}`);
    b.onclick = () => c.el.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    dots.appendChild(b);
  });
  const mark = () => {
    const mid = camps.scrollLeft + camps.clientWidth / 2;
    let best = 0, bd = 1e9;
    cfg.campaigns.forEach((c, i) => { const x = c.el.offsetLeft + c.el.offsetWidth / 2 - camps.offsetLeft; const dd = Math.abs(x - mid); if (dd < bd) { bd = dd; best = i; } });
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === best));
  };
  camps.addEventListener('scroll', () => requestAnimationFrame(mark), { passive: true });
  mark();
}

// タブ（11-07 佐藤さん「最初のページで興味付けさせることに全力を注いで、他はタブ作って各ページに飛ばす」「詳細なルールは別タブ、こだわりもいきなり出てきたら押しつけがましいから別タブ」）。
// 同じページの中で切り替える（X に貼るリンクは1本のまま）。#tab-rules のように付けて開くとそのタブから始まる
function setupTabs() {
  document.body.classList.add('tabmode');
  const main = document.querySelector('main');
  // 制作のこだわりは企画の枠から抜き出し、こだわりのタブへ1本ずつ並べる
  const kt = document.createElement('section'); kt.id = 'kodaTab';
  // 2段階（11-09 佐藤さん「こだわりのタブを選んだら。動画のタイトルとサムネが出てきて。一覧が選べる…一つ選んだら…この切り抜きの制作でこだわったことっていうのが出てくるようにしたい」）
  // 1段目＝サムネとタイトルの一覧（.klist）／2段目＝選んだ1本の動画＋こだわり（.ktab-item）。「一覧へ戻る」で1段目へ
  const kh = document.createElement('div'); kh.className = 'klist-title'; kh.textContent = '動画を選ぶと、その切り抜きの制作のこだわりが見られます';
  const kl = document.createElement('div'); kl.className = 'klist';
  const kback = document.createElement('button'); kback.type = 'button'; kback.className = 'ktab-back'; kback.textContent = '← 動画一覧へ戻る';
  kback.onclick = () => { kodaShow(null); scrollTo({ top: 0, behavior: 'instant' }); };
  kt.append(kh, kl, kback);
  function kodaShow(vid) {
    const list = !vid;
    kh.style.display = kl.style.display = list ? '' : 'none';
    kback.style.display = list ? 'none' : '';
    kt.querySelectorAll('.ktab-item').forEach(e => { e.style.display = e.dataset.vid === vid ? '' : 'none'; });
  }
  // 終わった企画のこだわりも一覧に足す（11-09 佐藤さん「ダイヤさんのポピープレイタイム3のやつとクリシアさんの同意したい前編のこだわりもかけるようにして」）。
  // config の kodaExtra（videoId・videoTitle・note）から、企画の枠と同じ「この切り抜きの制作でこだわったこと」の欄を作る
  const kodaExtra = (cfg.kodaExtra || []).filter(x => (x.note || '').trim() || document.getElementById('ed')).map(x => {   // 空のこだわりは普通のページでは出さない（11-09）
    const el = document.createElement('div');
    const nb = document.createElement('div'); nb.className = 'cnote';
    nb.innerHTML = '<div class="cn-title">この切り抜きの制作でこだわったこと</div><div class="cn-text" data-ph="ここに制作時のこだわりを書きます"></div>';
    nb.querySelector('.cn-text').textContent = x.note || ''; el.appendChild(nb);
    return { videoId: x.videoId, videoTitle: x.videoTitle, el, extra: true };
  });
  const kodaSeen = new Set();
  [...cfg.campaigns, ...kodaExtra].forEach(c => {
    if (!c.el || kodaSeen.has(c.videoId)) return;
    const parts = [...c.el.querySelectorAll('.cnote, .kodawari')];
    if (!parts.length) return;
    kodaSeen.add(c.videoId);
    const it = document.createElement('div'); it.className = 'ktab-item'; it.dataset.vid = c.videoId;
    const t = document.createElement('a'); t.className = 'ktab-title'; t.rel = 'noopener'; t.textContent = c.videoTitle || '';
    setThumb(t, document.createElement('img'), c.videoId, 'https://www.youtube.com/shorts/' + c.videoId);
    t.textContent = c.videoTitle || '';
    // こだわりの横で動画をページ内再生（11-09 佐藤さん「制作のこだわりのところは絶対隣に動画再生できるようにページを置いてほしい。文章だけだとわからないから」「動画を押しても依頼者様のYouTubeに飛ばずに、このページのまま再生できるようにできる？」）
    // 他の所（トップのカード等）は 10-31 からの「YouTube へ移る」のまま
    const pv = document.createElement('div'); pv.className = 'ktab-video';
    const fr = document.createElement('iframe'); fr.loading = 'lazy'; fr.title = c.videoTitle || '';
    fr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; fr.allowFullscreen = true;
    fr.src = 'https://www.youtube.com/embed/' + c.videoId + '?playsinline=1&rel=0';
    pv.appendChild(fr);
    const bd = document.createElement('div'); bd.className = 'ktab-body'; bd.append(t, ...parts);
    it.append(pv, bd); kt.appendChild(it);
    // 1段目の一覧のカード（サムネ＋タイトル）。押すとこの動画の2段目へ
    const card = document.createElement('button'); card.type = 'button'; card.className = 'kcard';
    const ci = document.createElement('img'); ci.alt = '';
    setThumb(document.createElement('a'), ci, c.videoId);   // サムネの取り方は動画のカードと同じ（灰色の仮の絵なら次を取る）
    const ct = document.createElement('span'); ct.className = 'kcard-t'; ct.textContent = c.videoTitle || '';
    card.append(ci, ct);
    card.onclick = () => { kodaShow(c.videoId); scrollTo({ top: 0, behavior: 'instant' }); try { gtag('event', 'jd_kodacard_' + c.videoId); } catch (_) {} };
    kl.appendChild(card);
    if (c.extra) return;   // 終わった企画は輪のカードが無い
    // 動画を選ぶ輪のカードに「この動画のこだわり」ボタン（11-08 佐藤さん「動画選択UIのところに、この動画のこだわり って書かれたボタンを用意して、そこからこだわりが見れる」）
    const kb = document.createElement('button'); kb.type = 'button'; kb.className = 'kdbtn'; kb.innerHTML = LS('kdBtn', 'この動画のこだわり');
    kb.onclick = e => { if (!c.el.classList.contains('front') && c.el.closest('.ring')) return; e.preventDefault(); go('koda', true); kodaShow(c.videoId);   // この動画の2段目へ直接
      try { gtag('event', 'jd_kodabtn_' + c.videoId); } catch (_) {} };
    const anchor = c.el.querySelector('.sub') || c.el.querySelector('.ctitle');
    if (anchor) anchor.after(kb); else c.el.appendChild(kb);
  });
  document.querySelector('.extras').before(kt);
  const tabs = [
    ['top', 'トップ', ['#pbox', '#camps', '.testnote']],
    ['rules', '罰ゲームについて', ['#rules']],   // 11-09 佐藤さん「ルールだけじゃ何のことかわかんないから罰ゲームについてにしておいて」
    ['koda', '制作のこだわり', ['#kodaTab']],
    ['punish', '罰ゲームの様子', ['#punishBox']],   // 11-09 佐藤さん「罰げーむのタブを罰ゲームの様子 にして」
    ['records', '戦績', ['#recordBox']],
  ].filter(([k, , sels]) => sels.some(s => { const e = document.querySelector(s); return e && !e.hidden && (k !== 'koda' || e.querySelector('.ktab-item')); }));
  kodaShow(null);
  const nav = document.createElement('nav'); nav.id = 'tabs';
  // 11-09 佐藤さん「トップっていうタブがいらなくて。一旦タップ（タブ）はページの一番上に持っていって。その後どうするか決める」「三箇条の下はメーターと動画だったでしょう」
  // → トップのボタンは出さない（メーターと動画は「どのタブも開いていない時」の中身）。開いているタブをもう一度押すとメーターと動画へ戻る
  tabs.forEach(([k, label, sels]) => {
    sels.forEach(s => document.querySelectorAll(s).forEach(e => { e.dataset.tab = k; }));
    // 11-09 佐藤さん「トップに戻るタブも追加して。書き方はTOPにして」
    const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = k === 'top' ? 'TOP' : label;
    b.onclick = () => go(k, true); nav.appendChild(b);
  });
  const cr = document.getElementById('creed'); if (cr) main.before(cr);   // 並び: 冒頭 → 編集三箇条 → メーターと動画（main）
  nav.classList.add('stuck', 'attop');
  document.body.prepend(nav);   // タブはページの一番上
  function go(k, user) {
    document.querySelectorAll('[data-tab]').forEach(e => e.classList.toggle('tab-off', e.dataset.tab !== k));
    nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    // タブを押したら、そのタブだけのページにする（11-09 佐藤さん「タブを押したら、そのタブ専用のページに行かないとおかしい」）。冒頭・三箇条・メーターと動画は隠す
    document.body.classList.toggle('tabpage', k !== 'top');
    if (k === 'koda' && user) kodaShow(null);   // こだわりのタブを押したら1段目（一覧）から
    if (user) {
      history.replaceState(null, '', k === 'top' ? location.pathname + location.search : '#tab-' + k);
      scrollTo({ top: 0, behavior: 'instant' });
      try { gtag('event', 'jd_tab_' + k); } catch (_) {}
      if (k === 'top') window.dispatchEvent(new Event('resize'));
    }
    document.querySelectorAll('[data-tab="' + k + '"] .fade, [data-tab="' + k + '"].fade').forEach(e => e.classList.add('show'));
  }
  const want = (location.hash.match(/^#tab-(\w+)/) || [])[1];
  go(tabs.some(t => t[0] === want) ? want : 'top');
}

// 企画の動画を輪のように並べる（11-07 佐藤さん「複数出す前提で、プレイヤー選択画面みたいに時計回りに動画が並ぶように」「真ん中に表示中の動画があって、その左右に別の動画が半透明で出る」「クリックしたらそれが正面に回転して出てくる」）
function setupRing() {
  const camps = document.getElementById('camps'), list = cfg.campaigns.map(c => c.el), n = list.length;
  if (!n) return;
  camps.classList.add('ring'); camps.classList.remove('solo');
  list.forEach(el => { el.classList.remove('fade'); el.classList.add('show'); });
  // 最初に正面へ出す動画は開くたびにランダム（11-09 佐藤さん「どっちが1番表に出るかはランダムに出来る？今後複数集計になる際はランダム表示になるようにして」）
  let cur = Math.floor(Math.random() * n);
  const nav = document.createElement('div'); nav.className = 'ringnav';
  nav.innerHTML = '<button type="button" class="rprev" aria-label="前の動画">◀</button><span class="rcount"></span><button type="button" class="rnext" aria-label="次の動画">▶</button>';
  if (n > 1) camps.after(nav);
  // 動画を選ぶ並びはライフの枠の左へ（11-07 佐藤さん「下の3項目縦並びに出来るでしょ、そしたら左が開くと思うからそこに動画選ぶUI一式持っていこう」）
  const pbox = document.getElementById('pbox');
  if (pbox) { const wrap = document.createElement('div'); wrap.className = 'pring'; pbox.appendChild(wrap); wrap.append(camps, nav); }
  const place = () => {
    list.forEach((el, i) => {
      let o = i - cur; if (o > n / 2) o -= n; if (o < -n / 2) o += n; if (n === 2 && o === -1) o = 1;   // 2本の時は右に置く
      const a = Math.abs(o);
      el.style.transform = `translateX(${o * 66}%) translateZ(${-a * 260}px) rotateY(${-o * 34}deg) scale(${1 - Math.min(a, 2) * .06})`;
      el.style.opacity = a === 0 ? 1 : a === 1 ? .32 : 0;
      el.style.zIndex = 10 - a;
      el.style.pointerEvents = a > 1 ? 'none' : '';
      el.classList.toggle('front', a === 0);
    });
    nav.querySelector('.rcount').textContent = `${cur + 1} / ${n}`;
  };
  const go = i => { cur = (i + n) % n; place(); try { gtag('event', 'jd_ring_' + (cur + 1)); } catch (_) {} };
  list.forEach((el, i) => el.addEventListener('click', e => { if (!el.classList.contains('front')) { e.preventDefault(); e.stopPropagation(); go(i); } }, true));
  nav.querySelector('.rprev').onclick = () => go(cur - 1);
  nav.querySelector('.rnext').onclick = () => go(cur + 1);
  let sx = null;
  camps.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  camps.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 50 && n > 1) go(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
  const fitH = () => { camps.style.height = Math.max(...list.map(el => el.offsetHeight)) + 'px'; };
  if (window.ResizeObserver) { const ro = new ResizeObserver(fitH); list.forEach(el => ro.observe(el)); }
  addEventListener('resize', fitH);
  place(); fitH();
}

// 編集三箇条を1条ずつ大きくふわっと出す（11-07 佐藤さん「編集3か条もっと大きく出したい」「下にいったら3か条が大きくふわっと出る感じ」）
function setupCreedReveal() {
  // 1画面に収めたので、画面に入ったら題→一→二→三の順に間を置いて出す
  const box = document.getElementById('creed');
  // 三箇条の下に、冒頭と同じ形の誘導（押すとメーターと動画の枠へ）
  const cue = document.createElement('button'); cue.type = 'button'; cue.className = 'ccue'; cue.innerHTML = LS('creedCue', '罰ゲーム状況') + '<b>▼</b>';
  cue.onclick = () => {   // メーターと動画の枠の上端がタブの帯に潜らない所で止める
    const pb = document.getElementById('pbox'), n = (pb && pb.closest('main')) || pb || box.nextElementSibling; if (!n) return;
    const nav = document.querySelector('.stuck'), off = (nav ? nav.getBoundingClientRect().height : 0) + 16;
    window.scrollTo({ top: n.getBoundingClientRect().top + window.scrollY - off, behavior: 'smooth' });
  };
  box.appendChild(cue);
  const items = [...box.querySelectorAll('.ctitle2, .item, .ccue')];
  items.forEach((e, i) => { e.classList.add('rv'); e.style.transitionDelay = (i * 0.45) + 's'; });
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { items.forEach(e => e.classList.add('in')); io.disconnect(); } }), { threshold: .3 });
  io.observe(box);
}

// 冒頭の全画面（11-07）: 背景に迷いの言葉を何段も流し（段ごとに向きと速さを変える）、中央に宣言を1行ずつ出す。下の「検証のルール」で次へ
function buildHero(hd, h) {
  document.body.classList.add('heromode');
  const sec = document.createElement('section'); sec.id = 'hero';
  const bg = document.createElement('div'); bg.className = 'hbg'; bg.setAttribute('aria-hidden', 'true');
  const ds = hd.doubts || [], rows = 9;
  for (let r = 0; r < rows && ds.length; r++) {
    const row = document.createElement('div'); row.className = 'hrow' + (r % 2 ? ' rev' : '') + (r % 3 === 1 ? ' big' : '');
    const seq = ds.map((_, i) => ds[(i + r * 3) % ds.length]);   // 段ごとに並びをずらす（5ずつだと10個の時に2通りしかできず、同じ言葉が縦に並んだ）
    const sp = document.createElement('span');
    [...seq, ...seq].forEach(t => { const it = document.createElement('i'); it.className = 'hd'; it.textContent = t; sp.appendChild(it); });   // 2周並べて半分動かすと継ぎ目なく回る
    sp.style.animationDuration = (90 + (r * 37) % 60) + 's';
    row.appendChild(sp); bg.appendChild(row);
  }
  const fg = document.createElement('div'); fg.className = 'hfg';
  const lines = (cls, text) => { const d = document.createElement('div'); d.className = cls;
    (text || '').split('|').forEach(t => { const s = document.createElement('span'); s.className = cls === 'hmain' ? 'hm-line' : 'hs-line'; s.textContent = t; d.appendChild(s); }); return d; };
  const m = lines('hmain', hd.main), s = lines('hsub', hd.sub);
  fg.append(m, s);
  [...fg.querySelectorAll('.hm-line, .hs-line')].forEach((e, i) => { e.style.transitionDelay = (0.3 + i * 0.45 + (e.classList.contains('hs-line') ? 0.5 : 0)) + 's'; });
  const cue = document.createElement('button'); cue.type = 'button'; cue.className = 'hcue'; cue.innerHTML = '<span></span><b>▼</b>';
  cue.firstChild.textContent = hd.cue || ''; cue.firstChild.dataset.lbl = 'cue';
  cue.onclick = () => { const n = document.getElementById('creed') || document.getElementById('rules') || document.getElementById('camps'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  sec.append(bg, fg, cue);
  document.querySelector('main').before(sec);   // main の余白の外に置き、画面いっぱいにする
  new IntersectionObserver(es => es.forEach(x => document.body.classList.toggle('heroview', x.intersectionRatio > .35)), { threshold: [0, .35, 1] }).observe(sec);
  requestAnimationFrame(() => requestAnimationFrame(() => sec.classList.add('on')));
}

// どこまで見て・どこで離れ・YouTube へ飛んだかを数える（11-01 佐藤さん「どこで離脱したのか、ちゃんとYouTubeに飛んで離脱してるのか」）。
// 中身はイベント名に入れる（GA の「イベント」レポートで設定なしに並ぶ）。gtag は公開アドレスでしか読まれないので手元では送られない。
//   jd_see_<場所>   その場所が画面に入った（top・c1・c2＝各企画のサムネ・gauge＝再生数の枠・steps＝STEPカード・punish・records）
//   jd_yt_main_c1 / jd_sub_c1 / jd_yt_punish / jd_yt_record / jd_portfolio / jd_rule  押した物
//   jd_alive_10s / 30s / 60s / 180s  開いたまま見ていた時間（画面が裏に回っている間は数えない）
//   jd_leave_at_<一番奥まで見た場所> / jd_leave_after_yt  離れた時（ページを閉じた・アプリへ移った）
function setupTrack() {
  const send = (name, p = {}) => { try { gtag('event', name, Object.assign({ transport_type: 'beacon' }, p)); } catch (_) {} };
  const order = ['top', 'creed', 'c1', 'c2', 'c3', 'kodawari', 'gauge', 'steps', 'punish', 'records'], seen = new Set();
  // どの投稿から来たか（11-05 佐藤さん「アクセス率に差が出るかも見てみたい」）: X の投稿ごとに ?from=know（ノウハウ）／?from=punish（罰ゲーム）等を付けて貼る → GA に jd_from_<名前>
  const from = (new URLSearchParams(location.search).get('from') || '').replace(/[^\w-]/g, '').slice(0, 20);
  if (from) send('jd_from_' + from);
  let deepest = 'top', clickedYt = false, left = false, visMs = 0, visFrom = document.hidden ? 0 : Date.now();
  const mark = z => { if (seen.has(z)) return; seen.add(z); send('jd_see_' + z); if (order.indexOf(z) > order.indexOf(deepest)) deepest = z; };
  mark('top');
  const zones = [];
  cfg.campaigns.forEach((c, i) => {
    zones.push([c.el.querySelector('.thumb'), 'c' + (i + 1)], [c.el.querySelector('.cbox'), 'gauge'], [c.el.querySelector('.mcards'), 'steps']);
    c.el.querySelector('.thumb').dataset.trk = 'jd_yt_main_c' + (i + 1);
    c.el.querySelector('.sub').dataset.trk = 'jd_sub_c' + (i + 1);
    const kd = c.el.querySelector('.kodawari');   // こだわりの欄（見た・そこから YouTube へ飛んだ）
    if (kd) { zones.push([kd, 'kodawari']); kd.querySelectorAll('a').forEach(a => { a.dataset.trk = 'jd_yt_kodawari_c' + (i + 1); }); }
  });
  zones.push([document.getElementById('punishBox'), 'punish'], [document.getElementById('recordBox'), 'records']);
  const cr = document.getElementById('creed'); if (cr) zones.push([cr, 'creed']);
  const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { mark(x.target.dataset.zone); io.unobserve(x.target); } }), { threshold: .5 });
  zones.forEach(([el, z]) => { if (el && !el.hidden) { el.dataset.zone = z; io.observe(el); } });
  document.addEventListener('click', e => {
    if (e.target.closest('#ruleBtn')) { send('jd_rule'); return; }
    const a = e.target.closest('a'); if (!a) return;
    let n = a.dataset.trk;
    if (!n) n = a.closest('#punishBox') ? 'jd_yt_punish' : a.closest('#records') ? 'jd_yt_record' : a.id === 'pflink' ? 'jd_portfolio' : 'jd_link_other';
    if (/^jd_(yt|sub)/.test(n)) clickedYt = true;
    send(n, { seconds: Math.round(watched() / 1000) });
  }, true);
  const watched = () => visMs + (visFrom ? Date.now() - visFrom : 0);
  const alive = [10, 30, 60, 180];
  const tick = setInterval(() => {
    while (alive.length && watched() >= alive[0] * 1000) send('jd_alive_' + alive.shift() + 's');
    if (!alive.length) clearInterval(tick);
  }, 1000);
  const leave = () => {
    if (left) return; left = true;
    send(clickedYt ? 'jd_leave_after_yt' : 'jd_leave_at_' + deepest, { seconds: Math.round(watched() / 1000) });
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (visFrom) { visMs += Date.now() - visFrom; visFrom = 0; } leave(); }
    else { visFrom = Date.now(); left = false; clickedYt = false; }   // 戻ってきたらもう一度離れた時を数える
  });
  addEventListener('pagehide', leave);
}
</script>
